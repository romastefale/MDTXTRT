<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>MDTXTRT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#fff; --fg:#111; --muted:#5c5c5c; --line:#e6e6e6; --surface:#f4f4f4; --accent:#111; --accent-fg:#fff; }
    html[data-theme="dark"] { --bg:#000; --fg:#f2f2f2; --muted:#9a9a9a; --line:#222; --surface:#111; --accent:#f2f2f2; --accent-fg:#000; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg:#000; --fg:#f2f2f2; --muted:#9a9a9a; --line:#222; --surface:#111; --accent:#f2f2f2; --accent-fg:#000; }
    }
    * { box-sizing: border-box; }
    html, body { height: var(--app-height, 100dvh); min-height: 100dvh; margin: 0; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    header, footer { flex-shrink: 0; }
    button { border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; border-radius: 0; box-shadow: none; }
    button:disabled { opacity: 0.4; cursor: default; }
    header { border-bottom: 1px solid var(--line); padding: max(0.45rem, env(safe-area-inset-top)) 12px 0; }
    .brand { display: flex; align-items: center; justify-content: space-between; height: 40px; }
    h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.14em; margin: 0; }
    .brand-actions { display: flex; align-items: center; gap: 4px; }
    .tag { font-size: 11px; color: var(--muted); }
    .icon-button { width: 36px; height: 36px; font-size: 20px; }
    nav { display: grid; grid-template-columns: 1fr 1fr; margin: 0 -12px -1px; }
    nav button { height: 40px; padding: 0 12px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
    nav button.on { color: var(--fg); border-bottom-color: var(--fg); }
    main { flex: 1; position: relative; min-height: 0; }
    textarea, .pane { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; outline: none; resize: none; padding: 16px 16px 76px; background: transparent; color: var(--fg); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 16px; line-height: 1.55; display: none; overflow: auto; }
    textarea.on, .pane.on { display: block; }
    .pane { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; white-space: pre-wrap; word-break: break-word; }
    .help { white-space: normal; }
    .help h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 1.6em 0 0.6em; }
    .help h2:first-of-type { margin-top: 0.2em; }
    .help p, .help li { font-size: 15px; line-height: 1.55; }
    .help ul { list-style: none; margin: 0.3em 0 0.8em; padding: 0; }
    .help li { padding: 0.45em 0; border-bottom: 1px solid var(--line); }
    .help code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.86em; }
    .pane a { color: inherit; }
    .pane code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.86em; background: var(--surface); padding: 0 4px; }
    .pane pre { background: var(--surface); padding: 12px; overflow: auto; }
    .pane blockquote { margin: 0.7em 0; padding-left: 12px; border-left: 2px solid var(--fg); color: var(--muted); }
    .pane details { margin: 0.7em 0; }
    .pane summary { cursor: pointer; font-weight: 500; }
    .spoiler { background: var(--fg); color: var(--fg); cursor: pointer; padding: 0 2px; }
    .spoiler.revealed { background: var(--surface); color: inherit; }
    .preview-note { margin: -4px 0 16px; padding: 8px 10px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .selection-tools { position: absolute; z-index: 4; left: 8px; right: 8px; bottom: 8px; display: none; grid-template-columns: repeat(7, 1fr); background: var(--surface); border: 1px solid var(--line); }
    .selection-tools.on { display: grid; }
    .selection-tools button { height: 42px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
    footer { display: grid; grid-template-columns: 1fr 1.35fr; gap: 1px; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); background: var(--line); }
    footer button { height: 46px; font-size: 13px; background: var(--bg); }
    footer button.solid { background: var(--accent); color: var(--accent-fg); }
    .toast { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); background: var(--accent); color: var(--accent-fg); padding: 8px 16px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity 150ms; }
    .toast.on { opacity: 1; }
    .drop { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; font-size: 14px; background: var(--bg); }
    .drop.on { display: flex; }
    .sheet-backdrop { position: fixed; z-index: 20; inset: 0; display: none; background: rgba(0,0,0,.42); }
    .sheet-backdrop.on { display: block; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: min(78vh, 620px); display: flex; flex-direction: column; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 14px; border-bottom: 1px solid var(--line); }
    .sheet-head strong { font-size: 14px; }
    .sheet-body { overflow: auto; padding: 12px; }
    .sheet h2 { margin: 14px 4px 7px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .sheet h2:first-child { margin-top: 0; }
    .generator-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .generator-grid button { min-height: 44px; padding: 7px 5px; background: var(--surface); font-size: 12px; }
    .sheet button.solid { background: var(--accent); color: var(--accent-fg); }
    .settings-grid { display: grid; gap: 8px; }
    .settings-grid label { color: var(--muted); font-size: 11px; }
    .settings-grid input { width: 100%; height: 42px; margin-top: 4px; padding: 0 10px; border: 1px solid var(--line); border-radius: 0; outline: none; background: var(--surface); color: var(--fg); font: inherit; }
    tg-button-row { display: flex; gap: 6px; margin: 8px 0; }
    tg-button { display: inline-flex; padding: 7px 11px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
    tg-map, tg-document { display: block; margin: 8px 0; padding: 18px; border: 1px solid var(--line); color: var(--muted); }
    tg-map::before { content: "Mapa do Telegram"; }
    tg-document::before { content: "Documento do Telegram"; }
    body.typing header { display: none; }
    body.typing textarea { padding-top: 12px; }
    @media (max-height: 520px) {
      footer button { height: 42px; }
      .selection-tools button { height: 38px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><h1>MDTXTRT</h1><div class="brand-actions"><span class="tag">Rich 10.3</span><button type="button" id="btnOptions" class="icon-button" aria-label="Opções">⋯</button></div></div>
    <nav>
      <button type="button" data-view="edit" class="on">editar</button>
      <button type="button" data-view="preview">prévia Telegram</button>
    </nav>
  </header>
  <main>
    <textarea id="editor" placeholder="# Título&#10;&#10;Escreva em **Markdown**."></textarea>
    <div id="preview" class="pane"></div>
    <div id="selectionTools" class="selection-tools" aria-label="Formatação da seleção"></div>
    <div id="drop" class="drop">Solte o arquivo .md</div>
  </main>
  <footer>
    <button type="button" id="btnInsert">＋ inserir</button>
    <button type="button" class="solid" id="btnChat">enviar ao chat</button>
  </footer>
  <input id="file" type="file" accept=".md,.markdown,.txt,.mdown,text/markdown,text/plain" hidden>
  <input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
  <div id="toast" class="toast"></div>
  <div id="insertBackdrop" class="sheet-backdrop" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-label="Inserir conteúdo Rich">
      <div class="sheet-head"><strong>Inserir Rich 10.3</strong><button type="button" data-close-sheet class="icon-button" aria-label="Fechar">×</button></div>
      <div id="generatorBody" class="sheet-body"></div>
    </section>
  </div>
  <div id="optionsBackdrop" class="sheet-backdrop" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-label="Opções do documento">
      <div class="sheet-head"><strong>Documento</strong><button type="button" data-close-sheet class="icon-button" aria-label="Fechar">×</button></div>
      <div class="sheet-body">
        <div class="settings-grid">
          <label>Título<input id="inpTitle" type="text" placeholder="Título do documento"></label>
          <label>Slug do Telegraph<input id="inpPath" type="text" placeholder="Opcional"></label>
        </div>
        <h2>Ações</h2>
        <div class="generator-grid">
          <button type="button" id="btnOpen">Abrir .md</button>
          <button type="button" id="btnMd">Exportar .md</button>
          <button type="button" id="btnPub">Telegraph</button>
        </div>
        <h2>Comandos no chat</h2>
        <p class="tag"><code>/tgrich</code> converte Markdown · <code>/mdrich</code> exporta uma mensagem · <code>/help</code> mostra a ajuda.</p>
      </div>
    </section>
  </div>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  var editor = document.getElementById("editor");
  var preview = document.getElementById("preview");
  var selectionTools = document.getElementById("selectionTools");
  var generatorBody = document.getElementById("generatorBody");
  var insertBackdrop = document.getElementById("insertBackdrop");
  var optionsBackdrop = document.getElementById("optionsBackdrop");
  var inpTitle = document.getElementById("inpTitle");
  var inpPath = document.getElementById("inpPath");
  var toastEl = document.getElementById("toast");
  var view = "edit";
  var toastTimer = null;
  var busy = false;

  function applyTheme() {
    var scheme = (tg && tg.colorScheme) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", scheme);
    var bg = scheme === "dark" ? "#000000" : "#ffffff";
    if (tg && tg.setHeaderColor) tg.setHeaderColor(bg);
    if (tg && tg.setBackgroundColor) tg.setBackgroundColor(bg);
  }
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  }
  var lastAppHeight = 0;
  function applyViewport() {
    var h = 0;
    var top = 0;
    if (window.visualViewport && window.visualViewport.height > 0) {
      h = window.visualViewport.height;
      top = window.visualViewport.offsetTop || 0;
    }
    if (!(h > 0)) h = window.innerHeight || 0;
    if (!(h > 0) && lastAppHeight > 0) h = lastAppHeight;
    if (h > 0) {
      lastAppHeight = h;
      document.documentElement.style.setProperty("--app-height", h + "px");
      document.documentElement.style.setProperty("--app-top", top + "px");
    } else {
      document.documentElement.style.removeProperty("--app-height");
    }
  }
  applyTheme();
  applyViewport();
  if (tg && tg.onEvent) {
    tg.onEvent("themeChanged", applyTheme);
    tg.onEvent("viewportChanged", applyViewport);
  }
  window.addEventListener("resize", applyViewport);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", applyViewport);
    window.visualViewport.addEventListener("scroll", applyViewport);
  }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
    if (!(tg && tg.colorScheme)) applyTheme();
  });

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("on"); }, 2200);
  }
  function save() {
    try {
      localStorage.setItem("mdtxtrt_draft", editor.value);
      localStorage.setItem("mdtxtrt_title", inpTitle.value);
      localStorage.setItem("mdtxtrt_path", inpPath.value);
    } catch (e) {}
  }
  try {
    editor.value = localStorage.getItem("mdtxtrt_draft") || "";
    inpTitle.value = localStorage.getItem("mdtxtrt_title") || "";
    inpPath.value = localStorage.getItem("mdtxtrt_path") || "";
  } catch (e) {}

  var TOOLS = [
    { l: "B", p: "**", s: "**" }, { l: "I", p: "_", s: "_" }, { l: "U", p: "__", s: "__" },
    { l: "S", p: "~~", s: "~~" }, { l: "||", p: "||", s: "||" }, { l: "code", p: "`", s: "`" },
    { l: "bloco", p: "```\n", s: "\n```" }, { l: "link", p: "[", s: "]()", link: 1 },
    { l: "img", photo: 1 },
    { l: ">", p: "> ", s: "", line: 1 }, { l: ">+", p: "**> ", s: "", line: 1 },
    { l: "•", p: "- ", s: "", line: 1 }, { l: "1.", p: "1. ", s: "", line: 1 },
    { l: "task", p: "- [ ] ", s: "", line: 1 },
    { l: "H1", p: "# ", s: "", line: 1 }, { l: "H2", p: "## ", s: "", line: 1 },
    { l: "H3", p: "### ", s: "", line: 1 },
    { l: "hr", p: "---\n", s: "", line: 1 }
  ];
  TOOLS.filter(function (t) {
    return ["B", "I", "U", "S", "||", "code", "link"].indexOf(t.l) >= 0;
  }).forEach(function (t) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = t.l;
    b.addEventListener("click", function () {
      if (t.photo) { document.getElementById("photo").click(); return; }
      insert(t.p, t.s, t.line);
      if (t.link) {
        var at = editor.selectionStart + 1;
        editor.setSelectionRange(at, at);
      }
    });
    b.addEventListener("pointerdown", function (e) { e.preventDefault(); });
    selectionTools.appendChild(b);
  });
  function insert(prefix, suffix, asLine) {
    var start = editor.selectionStart, end = editor.selectionEnd, v = editor.value;
    if (asLine) {
      var i = v.lastIndexOf("\n", start - 1) + 1;
      editor.value = v.slice(0, i) + prefix + v.slice(i);
      editor.focus();
      editor.setSelectionRange(start + prefix.length, end + prefix.length);
    } else {
      var sel = v.slice(start, end);
      editor.value = v.slice(0, start) + prefix + sel + suffix + v.slice(end);
      var pos = start + prefix.length + sel.length;
      editor.focus();
      editor.setSelectionRange(pos, pos);
    }
    save();
    updateSelectionTools();
  }

  function insertBlock(content) {
    var start = editor.selectionStart;
    var end = editor.selectionEnd;
    var value = editor.value;
    var before = start > 0 && value.charAt(start - 1) !== "\n" ? "\n\n" : "";
    var after = end < value.length && value.charAt(end) !== "\n" ? "\n\n" : "\n";
    editor.value = value.slice(0, start) + before + content + after + value.slice(end);
    var position = start + before.length + content.length;
    editor.focus();
    editor.setSelectionRange(position, position);
    save();
    closeSheets();
  }

  var GENERATORS = [
    { title: "Texto", items: [
      { l: "H1", v: "# Título" }, { l: "H2", v: "## Título" },
      { l: "H3", v: "### Título" }, { l: "H4", v: "#### Título" },
      { l: "H5", v: "##### Título" }, { l: "H6", v: "###### Título" },
      { l: "Marcado", v: "==texto marcado==" },
      { l: "Subscrito", v: "<sub>texto</sub>" },
      { l: "Sobrescrito", v: "<sup>texto</sup>" },
      { l: "Rodapé", v: "<footer>Rodapé</footer>" }
    ]},
    { title: "Estrutura", items: [
      { l: "Lista", v: "- item um\n- item dois" },
      { l: "Numerada", v: "1. primeiro\n2. segundo" },
      { l: "Tarefas", v: "- [ ] pendente\n- [x] concluída" },
      { l: "Divisor", v: "---" },
      { l: "Citação", v: "> Citação" },
      { l: "Expansível", v: "<blockquote expandable>\nCitação expansível\n</blockquote>" },
      { l: "Pull quote", v: "<aside>Citação em destaque<cite>Autor</cite></aside>" },
      { l: "Detalhes", v: "<details><summary>Título</summary>\nConteúdo recolhível\n</details>" },
      { l: "Código", v: "```python\nprint(\"Olá\")\n```" }
    ]},
    { title: "Conteúdo", items: [
      { l: "Tabela", v: "| Coluna A | Coluna B |\n|:--|--:|\n| valor | valor |" },
      { l: "Fórmula", v: "$x^2 + y^2$" },
      { l: "Fórmula bloco", v: "$$E = mc^2$$" },
      { l: "Âncora", v: "<a name=\"secao\"></a>" },
      { l: "Referência", v: "Texto com nota[^nota].\n\n[^nota]: Conteúdo da referência." },
      { l: "Mapa", action: "map" }
    ]},
    { title: "Mídia", items: [
      { l: "Foto", action: "photo" },
      { l: "Vídeo URL", action: "media", kind: "vídeo" },
      { l: "Áudio URL", action: "media", kind: "áudio" },
      { l: "Documento URL", action: "media", kind: "documento" },
      { l: "Collage", action: "collection", tag: "tg-collage" },
      { l: "Slideshow", action: "collection", tag: "tg-slideshow" }
    ]},
    { title: "Interação", items: [
      { l: "Botão URL", action: "urlButton" },
      { l: "Copiar texto", action: "copyButton" },
      { l: "Mini App", action: "appButton" }
    ]}
  ];

  var GENERATOR_FIELDS = {
    media: [
      { key: "url", label: "URL HTTPS", placeholder: "https://..." },
      { key: "caption", label: "Legenda", placeholder: "Opcional" }
    ],
    collection: [
      { key: "first", label: "Primeira URL HTTPS", placeholder: "https://..." },
      { key: "second", label: "Segunda URL HTTPS", placeholder: "https://..." }
    ],
    map: [
      { key: "lat", label: "Latitude", placeholder: "-23.5505" },
      { key: "long", label: "Longitude", placeholder: "-46.6333" }
    ],
    urlButton: [
      { key: "url", label: "URL HTTPS", placeholder: "https://..." },
      { key: "label", label: "Texto do botão", placeholder: "Abrir" }
    ],
    appButton: [
      { key: "url", label: "URL HTTPS do Mini App", placeholder: "https://..." },
      { key: "label", label: "Texto do botão", placeholder: "Abrir Mini App" }
    ],
    copyButton: [
      { key: "text", label: "Texto que será copiado", placeholder: "Conteúdo" },
      { key: "label", label: "Texto do botão", placeholder: "Copiar" }
    ]
  };

  function escaped(value) {
    return String(value || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;")
      .replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function isHttps(value) { return /^https:\/\//i.test(String(value || "").trim()); }

  function generatorValue(item, values) {
    if (!item.action) return item.v;
    if (item.action === "media") {
      if (!isHttps(values.url)) { showToast("A mídia precisa de URL HTTPS"); return ""; }
      var caption = escaped(values.caption || item.kind);
      return '![](' + values.url.trim() + ' "' + caption + '")';
    }
    if (item.action === "collection") {
      if (!isHttps(values.first) || !isHttps(values.second)) {
        showToast("As duas mídias precisam de URL HTTPS");
        return "";
      }
      return "<" + item.tag + ">\n\n![](" + values.first.trim() + ")\n![](" + values.second.trim() + ")\n\n</" + item.tag + ">";
    }
    if (item.action === "map") {
      if (!values.lat || !values.long) { showToast("Preencha latitude e longitude"); return ""; }
      return '<tg-map lat="' + escaped(values.lat) + '" long="' + escaped(values.long) + '" zoom="14"/>';
    }
    if (item.action === "urlButton" || item.action === "appButton") {
      if (!isHttps(values.url)) { showToast("O botão precisa de URL HTTPS"); return ""; }
      var type = item.action === "appButton" ? "web_app" : "url";
      var label = escaped(values.label || (type === "web_app" ? "Abrir Mini App" : "Abrir"));
      return '<tg-button-row align="center">\n<tg-button type="' + type + '" style="primary" url="' + escaped(values.url.trim()) + '">' + label + '</tg-button>\n</tg-button-row>';
    }
    if (item.action === "copyButton") {
      if (!values.text) { showToast("Informe o texto que será copiado"); return ""; }
      return '<tg-button-row align="center">\n<tg-button type="copy_text" text="' + escaped(values.text) + '">' + escaped(values.label || "Copiar") + '</tg-button>\n</tg-button-row>';
    }
    return "";
  }

  function renderGeneratorMenu() {
    generatorBody.innerHTML = "";
    GENERATORS.forEach(function (group) {
      var title = document.createElement("h2");
      title.textContent = group.title;
      generatorBody.appendChild(title);
      var grid = document.createElement("div");
      grid.className = "generator-grid";
      group.items.forEach(function (item) {
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = item.l;
        button.addEventListener("click", function () {
          if (item.action === "photo") {
            closeSheets();
            document.getElementById("photo").click();
          } else if (item.action) {
            showGeneratorForm(item);
          } else {
            insertBlock(item.v);
          }
        });
        grid.appendChild(button);
      });
      generatorBody.appendChild(grid);
    });
  }

  function showGeneratorForm(item) {
    var fields = GENERATOR_FIELDS[item.action] || [];
    generatorBody.innerHTML = "";
    var back = document.createElement("button");
    back.type = "button";
    back.textContent = "← todos os blocos";
    back.onclick = renderGeneratorMenu;
    generatorBody.appendChild(back);
    var heading = document.createElement("h2");
    heading.textContent = item.l;
    generatorBody.appendChild(heading);
    var form = document.createElement("form");
    form.className = "settings-grid";
    fields.forEach(function (field) {
      var label = document.createElement("label");
      label.textContent = field.label;
      var input = document.createElement("input");
      input.name = field.key;
      input.placeholder = field.placeholder || "";
      input.autocomplete = "off";
      label.appendChild(input);
      form.appendChild(label);
    });
    var submit = document.createElement("button");
    submit.type = "submit";
    submit.className = "solid";
    submit.textContent = "Inserir no texto";
    submit.style.minHeight = "46px";
    form.appendChild(submit);
    form.onsubmit = function (event) {
      event.preventDefault();
      var values = {};
      fields.forEach(function (field) {
        values[field.key] = form.elements[field.key].value.trim();
      });
      var value = generatorValue(item, values);
      if (value) insertBlock(value);
    };
    generatorBody.appendChild(form);
    var first = form.querySelector("input");
    if (first) first.focus();
  }
  renderGeneratorMenu();

  function openSheet(backdrop) {
    document.activeElement.blur();
    backdrop.classList.add("on");
    backdrop.setAttribute("aria-hidden", "false");
  }
  function closeSheets() {
    [insertBackdrop, optionsBackdrop].forEach(function (backdrop) {
      backdrop.classList.remove("on");
      backdrop.setAttribute("aria-hidden", "true");
    });
  }
  document.getElementById("btnInsert").onclick = function () {
    renderGeneratorMenu();
    openSheet(insertBackdrop);
  };
  document.getElementById("btnOptions").onclick = function () { openSheet(optionsBackdrop); };
  document.querySelectorAll("[data-close-sheet]").forEach(function (button) {
    button.onclick = closeSheets;
  });
  [insertBackdrop, optionsBackdrop].forEach(function (backdrop) {
    backdrop.addEventListener("click", function (event) {
      if (event.target === backdrop) closeSheets();
    });
  });

  function updateSelectionTools() {
    var selected = document.activeElement === editor && editor.selectionEnd > editor.selectionStart;
    selectionTools.classList.toggle("on", selected && view === "edit");
  }
  editor.addEventListener("select", updateSelectionTools);
  editor.addEventListener("keyup", updateSelectionTools);
  editor.addEventListener("focus", function () {
    document.body.classList.add("typing");
    updateSelectionTools();
  });
  editor.addEventListener("blur", function () {
    window.setTimeout(function () {
      if (document.activeElement !== editor) {
        document.body.classList.remove("typing");
        selectionTools.classList.remove("on");
      }
    }, 120);
  });

  function markdownForRichApi(src) {
    var lines = String(src || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
    var out = [];
    var i = 0;
    while (i < lines.length) {
      var stripped = lines[i].trim();
      var expandable = /^\*\*>\s?/.test(stripped) || (stripped.charAt(0) === ">" && stripped.slice(-2) === "||");
      if (expandable) {
        var quote = [];
        while (i < lines.length) {
          var s = lines[i].trim();
          var exp = s.match(/^\*\*>\s?(.*)$/);
          if (!(exp || s.charAt(0) === ">")) break;
          var piece = exp ? exp[1] : s.replace(/^>\s?/, "");
          if (piece.slice(-2) === "||") piece = piece.slice(0, -2).replace(/\s+$/, "");
          quote.push(piece);
          i += 1;
        }
        var body = quote.join("\n").replace(/^\s+|\s+$/g, "");
        out.push("<blockquote expandable>\n" + body + "\n</blockquote>");
        continue;
      }
      out.push(lines[i]);
      i += 1;
    }
    return out.join("\n");
  }
  function renderGfm(src) {
    var prepared = String(src || "").replace(
      /!\[([^\]]*)\]\(mdtxtrt:\/\/media\/([A-Za-z0-9_-]+)\)/g,
      "![$1](/media/$2)"
    );
    var md = markdownForRichApi(prepared).replace(/\|\|(.*?)\|\|/g, "<span class=\"spoiler\">$1</span>");
    if (!String(src || "").trim()) return "";
    return window.marked ? marked.parse(md) : md;
  }
  function badPhotoMarks(src) {
    var bad = [];
    var re = /!\[([^\]]*)\]\(([^)]*)\)/g;
    var m;
    while ((m = re.exec(src || ""))) {
      var u = String(m[2] || "").trim();
      if (/^mdtxtrt:\/\/media\/[A-Za-z0-9_-]+$/.test(u)) continue;
      if (/^https:\/\//i.test(u) && u.length > 10) continue;
      bad.push(u || "vazio");
    }
    return bad;
  }
  function optimize(src) {
    var t = src.replace(/\r\n/g, "\n").replace(/^\ufeff/, "");
    t = t.split("\n").map(function (l) { return l.replace(/[ \t]+$/g, ""); }).join("\n");
    t = t.replace(/\n{3,}/g, "\n\n").trim();
    return t ? t + "\n" : "";
  }

  function setView(v) {
    view = v;
    document.querySelectorAll("nav button").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-view") === v);
    });
    editor.classList.toggle("on", v === "edit");
    preview.classList.toggle("on", v === "preview");
    if (v === "preview") {
      preview.innerHTML = editor.value.trim()
        ? '<div class="preview-note">Prévia local aproximada. O resultado definitivo é renderizado pelo Telegram ao enviar.</div>' + renderGfm(editor.value)
        : "<p style=\"color:var(--muted)\">Nada para pré-visualizar.</p>";
    }
    selectionTools.classList.toggle("on", false);
  }
  setView("edit");
  document.querySelectorAll("nav button").forEach(function (b) {
    b.addEventListener("click", function () { setView(b.getAttribute("data-view")); });
  });
  document.querySelector("main").addEventListener("click", function (e) {
    if (e.target.classList && e.target.classList.contains("spoiler")) e.target.classList.toggle("revealed");
  });

  function loadFile(file) {
    var n = (file.name || "").toLowerCase();
    var mime = (file.type || "").toLowerCase();
    if (mime.indexOf("image/") === 0 || /\.(jpe?g|png|webp|gif)$/.test(n)) {
      insertPhoto(file);
      return;
    }
    if (!/\.(md|markdown|mdown|txt)$/.test(n) && mime && mime.indexOf("text/") !== 0) {
      showToast("Envie um arquivo .md ou uma fotografia");
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      editor.value = optimize(String(reader.result || ""));
      if (!inpTitle.value) inpTitle.value = file.name.replace(/\.[^.]+$/, "");
      save();
      setView("edit");
      showToast("Arquivo aberto");
    };
    reader.readAsText(file);
  }
  document.getElementById("btnOpen").onclick = function () {
    closeSheets();
    document.getElementById("file").click();
  };
  document.getElementById("file").onchange = function (e) {
    if (e.target.files[0]) loadFile(e.target.files[0]);
    e.target.value = "";
  };
  document.getElementById("photo").onchange = function (e) {
    if (e.target.files[0]) insertPhoto(e.target.files[0]);
    e.target.value = "";
  };
  async function insertPhoto(file) {
    if (busy) return;
    busy = true;
    try {
      var fd = new FormData();
      fd.append("file", file);
      var res = await fetch("/api/media", { method: "POST", body: fd });
      var json = await res.json().catch(function () { return {}; });
      if (!res.ok || !json.id) throw new Error(json.error || "Não foi possível enviar a foto");
      var tag = "![](mdtxtrt://media/" + json.id + ")";
      var start = editor.selectionStart;
      var v = editor.value;
      var pad = start > 0 && v.charAt(start - 1) !== "\n" ? "\n" : "";
      editor.value = v.slice(0, start) + pad + tag + "\n" + v.slice(editor.selectionEnd);
      var pos = start + pad.length + tag.length + 1;
      editor.focus();
      editor.setSelectionRange(pos, pos);
      save();
      showToast("Fotografia no documento");
    } catch (err) {
      showToast(err.message || "Foto recusada");
    }
    busy = false;
  }
  document.body.addEventListener("dragover", function (e) {
    e.preventDefault();
    document.getElementById("drop").classList.add("on");
  });
  document.body.addEventListener("dragleave", function () {
    document.getElementById("drop").classList.remove("on");
  });
  document.body.addEventListener("drop", function (e) {
    e.preventDefault();
    document.getElementById("drop").classList.remove("on");
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  document.getElementById("btnMd").onclick = async function () {
    closeSheets();
    var md = optimize(editor.value);
    if (!md.trim()) { showToast("Documento vazio"); return; }
    if (busy) return;
    busy = true;
    try {
      await deliverToBot("mdrich");
      showToast("Arquivo .md no chat");
    } catch (err) {
      try {
        await navigator.clipboard.writeText(md);
        showToast("Markdown copiado");
      } catch (e) {
        showToast("Não foi possível exportar");
      }
    }
    busy = false;
  };

  function telegramInitData() {
    if (!tg) return "";
    try { if (tg.ready) tg.ready(); } catch (e) {}
    return String(tg.initData || "").trim();
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { return false; }
  }
  async function deliverToBot(action) {
    var res = await fetch("/api/stash", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: action,
        title: inpTitle.value || "Sem título",
        content: editor.value
      })
    });
    var json = await res.json().catch(function () { return {}; });
    if (!res.ok || !json.url) throw new Error(json.error || "Não foi possível enviar");
    if (tg && tg.openTelegramLink) tg.openTelegramLink(json.url);
    else window.location.href = json.url;
  }
  async function postAPI(endpoint) {
    if (!editor.value.trim()) { showToast("Documento vazio"); return null; }
    save();
    var initData = telegramInitData();
    if (!initData) throw new Error("Abre o Mini App pelo botão no Telegram");
    var headers = { "Content-Type": "application/json" };
    headers.Authorization = "tma " + initData;
    headers["X-Telegram-Init-Data"] = initData;
    var res = await fetch(endpoint, {
      method: "POST",
      headers: headers,
      body: JSON.stringify({
        init_data: initData,
        initData: initData,
        title: inpTitle.value || "Sem título",
        path: inpPath.value || "",
        content: editor.value
      })
    });
    var json = await res.json().catch(function () { return {}; });
    if (!res.ok || json.ok === false) throw new Error(json.error || ("HTTP " + res.status));
    return json;
  }
  async function sendChat() {
    if (busy) return;
    if (!editor.value.trim()) { showToast("Documento vazio"); return; }
    var bad = badPhotoMarks(editor.value);
    if (bad.length) {
      showToast("Mídia com URL inválida. Use Inserir.");
      return;
    }
    busy = true;
    try {
      await deliverToBot("chat");
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      showToast("Enviado ao chat");
    } catch (err) {
      if (await copyText(optimize(editor.value))) showToast("Markdown copiado");
      else showToast("Não foi possível enviar");
    }
    busy = false;
  }

  document.getElementById("btnChat").onclick = sendChat;
  document.getElementById("btnPub").onclick = async function () {
    closeSheets();
    if (busy) return;
    if (!editor.value.trim()) { showToast("Documento vazio"); return; }
    if (!telegramInitData()) {
      showToast("Abre o Mini App pelo botão no Telegram para publicar");
      return;
    }
    busy = true;
    try {
      var json = await postAPI("/api/publish");
      if (json && json.url) {
        try { await navigator.clipboard.writeText(json.url); } catch (e) {}
        showToast("Publicado no Telegraph");
        if (tg && tg.openLink) tg.openLink(json.url);
      }
    } catch (err) {
      showToast(err.message || "Falha ao publicar");
    }
    busy = false;
  };
  if (tg && tg.MainButton) tg.MainButton.hide();
  editor.addEventListener("input", function () {
    save();
    updateSelectionTools();
  });
  inpTitle.addEventListener("input", save);
  inpPath.addEventListener("input", save);
})();

</script>
</body>
</html>
