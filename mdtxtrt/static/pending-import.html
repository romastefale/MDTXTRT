<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MDTXTRT — Importação</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#171717);--hint:var(--tg-theme-hint-color,#747474);--surface:var(--tg-theme-secondary-bg-color,#f3f4f6);--accent:var(--tg-theme-button-color,#2481cc);--accent-text:var(--tg-theme-button-text-color,#fff);--line:color-mix(in srgb,var(--hint) 28%,transparent)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(560px,100%);border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--surface)}h1{font-size:20px;margin:0 0 8px}p{line-height:1.45}.muted{color:var(--hint);font-size:13px}.field{display:grid;gap:6px;margin:18px 0}.field label{font-size:13px}.field input{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--bg);color:var(--text)}button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:var(--accent-text);border-radius:9px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.55}.error{color:#d33;white-space:pre-wrap}
  </style>
</head>
<body>
  <main class="card">
    <h1>Concluir importação</h1>
    <p id="summary">Carregando o arquivo preservado…</p>
    <p class="muted">O MDTXTRT não adivinha o encoding. O arquivo original permanece armazenado enquanto você escolhe.</p>
    <form id="form" hidden>
      <div class="field"><label for="encoding">Encoding</label><input id="encoding" name="encoding" value="windows-1252" autocomplete="off" required></div>
      <button id="complete" type="submit">Importar com este encoding</button>
    </form>
    <p id="error" class="error"></p>
  </main>
<script type="module">
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const id=new URLSearchParams(location.search).get("pending_import");
const headers=()=>({"X-Telegram-Init-Data":tg?.initData||""});
const summary=document.querySelector("#summary"),form=document.querySelector("#form"),error=document.querySelector("#error"),button=document.querySelector("#complete");
async function api(path,options={}){const response=await fetch(path,{...options,headers:{...headers(),...(options.headers||{})}});let data={};try{data=await response.json()}catch{}if(!response.ok||data.ok===false)throw new Error(data.error||`HTTP ${response.status}`);return data}
function draftUrl(draftId){const url=new URL("/",location.origin);url.searchParams.set("draft",draftId);return url.toString()}
async function load(){if(!id){error.textContent="Identificador de importação ausente.";return}try{const data=await api(`/api/imports/pending/${encodeURIComponent(id)}`);const pending=data.pending_import;if(pending.status==="completed"&&pending.draft_id){location.replace(draftUrl(pending.draft_id));return}summary.textContent=`${pending.filename} — ${pending.size} bytes — SHA-256 ${pending.sha256}`;form.hidden=false}catch(e){error.textContent=e.message}}
form.addEventListener("submit",async event=>{event.preventDefault();button.disabled=true;error.textContent="";try{const data=await api(`/api/imports/pending/${encodeURIComponent(id)}/complete`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({encoding:document.querySelector("#encoding").value.trim()})});location.replace(draftUrl(data.draft.id))}catch(e){error.textContent=e.message;button.disabled=false}});
load();
</script>
</body>
</html>
