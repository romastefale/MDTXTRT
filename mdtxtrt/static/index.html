<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MDTXTRT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap" rel="stylesheet">
  <style>
    /* Visual do layout #54 */
    :root{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;color-scheme:light dark;--bg:#fff;--text:#111;--hint:#5c5c5c;--surface:#f4f4f4;--accent:#111;--accent-text:#fff;--line:#e6e6e6}
    html[data-theme="dark"]{--bg:#000;--text:#f2f2f2;--hint:#9a9a9a;--surface:#111;--accent:#f2f2f2;--accent-text:#000;--line:#222}
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--text:#f2f2f2;--hint:#9a9a9a;--surface:#111;--accent:#f2f2f2;--accent-text:#000;--line:#222}}
    *{box-sizing:border-box}
    html,body{height:var(--app-height,100dvh);min-height:100dvh;margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer;border-radius:0;box-shadow:none}
    .app{height:var(--app-height,100dvh);min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    .top,.bottom{flex-shrink:0}
    .top{z-index:20;padding-top:max(.45rem,env(safe-area-inset-top),var(--tg-safe-area-inset-top,0px),var(--tg-content-safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line)}
    .head{display:flex;align-items:center;height:40px;gap:8px;padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
    .brand{font-size:14px;font-weight:600;letter-spacing:.14em}
    .draft-name{min-width:0;flex:1;border:0;border-radius:0;background:transparent;color:var(--hint);font-weight:600;font-size:12px;padding:6px 8px}
    .draft-name:focus{outline:0;color:var(--text)}
    .status{max-width:72px;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--hint);white-space:nowrap}
    .icon-btn,.tool,.action{border:0;background:var(--surface);border-radius:0;padding:7px 10px}
    .icon-btn:active,.tool:active,.action:active{transform:translateY(1px)}
    .view-tabs{display:grid;grid-template-columns:1fr 1fr;padding:0;margin-bottom:-1px;border-top:1px solid var(--line)}
    .view-tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--hint);height:40px;padding:0 12px;font-size:13px;font-weight:400}
    .view-tab[aria-selected="true"]{border-bottom-color:var(--text);color:var(--text)}
    .toolbar{display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:1px;overflow:hidden;padding:4px;border-top:1px solid var(--line);background:var(--bg)}
    .toolbar details{position:relative;flex:0 0 44px;min-width:44px}
    .toolbar summary{list-style:none}
    .toolbar summary::-webkit-details-marker{display:none}
    .tool{width:44px;min-width:44px;max-width:44px;height:44px;flex:0 0 44px;padding:0;display:inline-flex;align-items:center;justify-content:center;overflow:hidden}.tool svg{width:24px;height:24px;display:block;flex:0 0 24px}
    .tool.active,.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-text)}
    .menu{position:fixed;left:8px;right:8px;max-height:min(62vh,460px);overflow:auto;z-index:50;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;padding:1px;background:var(--line);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.18);border-radius:0}
    .menu button{text-align:left;border:0;background:var(--bg);min-height:48px;padding:7px 8px;border-radius:0;font-size:12px}
    .menu small{display:block;color:var(--hint);margin-top:2px;font-size:10px}
    .editor-wrap{position:relative;flex:1;min-height:0;width:100%;margin:0;padding:0;overflow:auto}
    .editor,.telegram-preview{width:min(900px,100%);min-height:100%;margin:0 auto;padding:16px 16px 76px;outline:none;font-size:16px;line-height:1.55}
    .editor{font-family:"IBM Plex Mono",ui-monospace,monospace}
    .telegram-preview{max-width:680px;font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;white-space:pre-wrap;word-break:break-word}
    .editor:empty:before{content:"Comece a escrever…";color:var(--hint)}
    .editor [data-block],.telegram-preview [data-block]{position:relative;margin:0 0 12px;outline:none}
    .editor [data-block]:focus{box-shadow:none}
    .editor pre,.telegram-preview pre{white-space:pre-wrap;background:var(--surface);padding:12px;border-radius:0;font-family:"IBM Plex Mono",ui-monospace,monospace}
    .editor blockquote,.telegram-preview blockquote{border-left:2px solid var(--text);padding-left:12px;margin-left:0;color:var(--hint)}
    .editor [data-inline="spoiler"]{background:var(--text);color:transparent}
    .editor [data-inline="spoiler"]:hover,.editor [data-inline="spoiler"]:focus{color:var(--bg)}
    .node-card{border:1px solid var(--line);border-radius:0;background:var(--surface);padding:11px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;user-select:none}
    .node-card strong{font-size:13px}
    .node-card .summary{font-size:13px;color:var(--hint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .node-card button{grid-column:2;grid-row:1/3;border:0;background:transparent;color:var(--text);font-weight:600}
    .bottom{z-index:30;display:grid;grid-template-columns:44px 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);padding:0 0 max(env(safe-area-inset-bottom),var(--tg-content-safe-area-inset-bottom,0px))}
    .bottom .action{height:48px;min-width:0;border:0;border-radius:0;background:var(--bg);font-size:13px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bottom .primary{background:var(--accent);color:var(--accent-text)}
    .destination{display:grid;grid-template-columns:1fr 1fr;gap:1px;min-width:0}
    #open-library{padding:0;display:inline-flex;align-items:center;justify-content:center}
    #open-library svg{width:24px;height:24px;display:block;flex:0 0 24px}
    .menu[hidden]{display:none!important}
    dialog{border-radius:0;width:min(680px,calc(100% - 24px));max-height:82vh;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0;box-shadow:0 28px 80px #0004}
    dialog::backdrop{background:rgba(0,0,0,.42)}
    .dialog-head{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-bottom:1px solid var(--line)}
    .dialog-head h2{font-size:14px;margin:0;flex:1}
    .dialog-head button{border:0;background:transparent;color:var(--hint)}
    .dialog-body{padding:12px;overflow:auto;max-height:62vh}
    .dialog-actions{display:flex;justify-content:flex-end;gap:1px;padding:1px;background:var(--line)}
    .dialog-actions button{border:0;background:var(--bg);border-radius:0;min-height:42px;padding:8px 12px}
    .dialog-actions .primary{background:var(--accent);color:var(--accent-text)}
    .field{display:grid;gap:5px;margin:0 0 12px}
    .field label{font-size:11px;color:var(--hint)}
    .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:0;padding:9px}
    .field textarea{min-height:110px;resize:vertical}
    .check{display:flex;align-items:center;gap:8px;margin:8px 0}
    .list-row{display:grid;grid-template-columns:1fr auto;gap:5px 9px;padding:10px 0;border-bottom:1px solid var(--line)}
    .list-row:last-child{border-bottom:0}
    .list-row small{color:var(--hint)}
    .list-actions{grid-column:2;grid-row:1/3;display:flex;gap:1px;align-items:center}
    .list-actions button{border:0;background:var(--surface);border-radius:0;padding:7px}
    .review-box{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border-radius:0;padding:10px;max-height:220px;overflow:auto}
    .warnings{display:grid;gap:7px;margin:10px 0}
    .warning{padding:8px 10px;border:1px solid var(--line);border-radius:0}
    .warning b{display:block;font-size:12px}
    .muted{color:var(--hint);font-size:12px}
    .telegram-preview .node-card button{display:none}
    .danger{color:#d33}
    .hidden{display:none!important}
    @media(max-width:520px){
      .draft-name{max-width:42vw}
      .menu{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(min-width:760px){.menu{left:auto;right:18px;width:620px}.editor,.telegram-preview{padding-top:28px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="head">
      <span class="brand">MDTXTRT</span>
      <input id="draft-name" class="draft-name" aria-label="Nome do rascunho" value="Novo rascunho">
      <span id="status" class="status">iniciando</span>
    </div>
    <div class="view-tabs" role="tablist" aria-label="Visualização do documento">
      <button class="view-tab" role="tab" aria-selected="true" aria-controls="editor" data-view="edit">Editar</button>
      <button class="view-tab" role="tab" aria-selected="false" aria-controls="telegram-preview" data-view="preview">Prévia Telegram</button>
    </div>
    <nav class="toolbar" aria-label="Ferramentas de edição">
      <button class="tool" data-format="bold" type="button" title="Negrito" aria-label="Negrito"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8" /></svg></button>
      <button class="tool" data-format="italic" type="button" title="Itálico" aria-label="Itálico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" x2="10" y1="4" y2="4" /> <line x1="14" x2="5" y1="20" y2="20" /> <line x1="15" x2="9" y1="4" y2="20" /></svg></button>
      <button class="tool" data-format="underline" type="button" title="Sublinhado" aria-label="Sublinhado"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v6a6 6 0 0 0 12 0V4" /> <line x1="4" x2="20" y1="20" y2="20" /></svg></button>
      <button class="tool" data-format="strikethrough" type="button" title="Riscado" aria-label="Riscado"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4H9a3 3 0 0 0-2.83 4" /> <path d="M14 12a4 4 0 0 1 0 8H6" /> <line x1="4" x2="20" y1="12" y2="12" /></svg></button>
      <button class="tool" data-format="code" type="button" title="Código inline" aria-label="Código inline"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6" /> <path d="m8 6-6 6 6 6" /></svg></button>
      <details><summary class="tool" title="Texto" aria-label="Texto"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16" /> <path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2" /> <path d="M9 20h6" /></svg></summary><div class="menu">
        <button data-format="marked"><b>Marcado</b><small>realce de texto</small></button>
        <button data-format="spoiler"><b>Spoiler</b><small>texto ocultável</small></button>
        <button data-format="subscript"><b>Subscrito</b><small>índice inferior</small></button>
        <button data-format="superscript"><b>Sobrescrito</b><small>índice superior</small></button>
        <button data-inline-form="url"><b>Link</b><small>HTTP, HTTPS ou tg://</small></button>
        <button data-inline-form="text_mention"><b>Usuário</b><small>menção por ID</small></button>
        <button data-inline-form="custom_emoji"><b>Emoji personalizado</b><small>ID + texto alternativo</small></button>
        <button data-inline-form="datetime"><b>Data/hora</b><small>Unix + formato</small></button>
        <button data-inline-form="math_inline"><b>Fórmula inline</b><small>LaTeX</small></button>
        <button data-inline-form="anchor_link"><b>Link interno</b><small>âncora ou referência</small></button>
      </div></details>
      <details><summary class="tool" title="Bloco" aria-label="Bloco"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h12" /> <path d="M6 20V4" /> <path d="M18 20V4" /></svg></summary><div class="menu">
        <button data-block-action="paragraph"><b>Parágrafo</b><small>bloco normal</small></button>
        <button data-block-action="heading" data-level="1"><b>H1</b><small>título principal</small></button>
        <button data-block-action="heading" data-level="2"><b>H2</b><small>seção</small></button>
        <button data-block-action="heading" data-level="3"><b>H3</b><small>subseção</small></button>
        <button data-block-action="heading" data-level="4"><b>H4</b><small>heading</small></button>
        <button data-block-action="heading" data-level="5"><b>H5</b><small>heading</small></button>
        <button data-block-action="heading" data-level="6"><b>H6</b><small>heading</small></button>
        <button data-block-action="blockquote"><b>Citação</b><small>blockquote</small></button>
        <button data-block-action="expandable_blockquote"><b>Citação expansível</b><small>Bot API 10.3</small></button>
        <button data-block-action="pullquote"><b>Pull quote</b><small>citação destacada</small></button>
        <button data-block-action="code_block"><b>Código</b><small>preformatado</small></button>
        <button data-block-action="footer"><b>Rodapé</b><small>footer Rich</small></button>
        <button data-insert="divider"><b>Divisor</b><small>linha horizontal</small></button>
        <button id="delete-block"><b>Excluir bloco</b><small>remove o bloco ativo</small></button>
      </div></details>
      <details><summary class="tool" title="Lista" aria-label="Lista"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h.01" /> <path d="M3 12h.01" /> <path d="M3 19h.01" /> <path d="M8 5h13" /> <path d="M8 12h13" /> <path d="M8 19h13" /></svg></summary><div class="menu">
        <button data-structured="list" data-preset="unordered"><b>Marcadores</b><small>lista não ordenada</small></button>
        <button data-structured="list" data-preset="ordered"><b>Numerada</b><small>lista ordenada</small></button>
        <button data-structured="list" data-preset="task"><b>Tarefas</b><small>checkboxes</small></button>
      </div></details>
      <details><summary class="tool" title="Estrutura" aria-label="Estrutura"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18" /> <rect width="18" height="18" x="3" y="3" rx="2" /> <path d="M3 9h18" /> <path d="M3 15h18" /></svg></summary><div class="menu">
        <button data-structured="table"><b>Tabela</b><small>bordas, listras, compacta</small></button>
        <button data-structured="details"><b>Detalhes</b><small>recolhível/expandido</small></button>
        <button data-structured="math_block"><b>Fórmula</b><small>LaTeX em bloco</small></button>
        <button data-structured="anchor"><b>Âncora</b><small>navegação interna</small></button>
        <button data-structured="reference"><b>Referência</b><small>nota referenciada</small></button>
        <button id="native-location"><b>Localização Telegram</b><small>Location/Venue nativa</small></button>
        <button data-structured="map"><b>Mapa manual</b><small>fallback por coordenadas</small></button>
      </div></details>
      <details><summary class="tool" title="Mídia" aria-label="Mídia"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2" /> <circle cx="9" cy="9" r="2" /> <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /></svg></summary><div class="menu">
        <button data-local-media="photo"><b>Foto local</b><small>BLOB preservado + SHA-256</small></button>
        <button data-local-media="video"><b>Vídeo local</b><small>BLOB preservado + SHA-256</small></button>
        <button data-local-media="animation"><b>Animação local</b><small>BLOB preservado + SHA-256</small></button>
        <button data-local-media="audio"><b>Áudio local</b><small>BLOB preservado + SHA-256</small></button>
        <button data-local-media="voice_note"><b>Voz local</b><small>voice note Rich</small></button>
        <button data-local-media="document"><b>Documento local</b><small>Bot API 10.3</small></button>
        <button data-media="photo"><b>Foto por URL</b><small>HTTP/HTTPS</small></button>
        <button data-media="video"><b>Vídeo por URL</b><small>HTTP/HTTPS</small></button>
        <button data-media="animation"><b>Animação por URL</b><small>HTTP/HTTPS</small></button>
        <button data-media="audio"><b>Áudio por URL</b><small>HTTP/HTTPS</small></button>
        <button data-media="voice_note"><b>Voz por URL</b><small>HTTP/HTTPS</small></button>
        <button data-media="document"><b>Documento por URL</b><small>HTTP/HTTPS</small></button>
        <button data-structured="collage"><b>Collage</b><small>fotos/vídeos</small></button>
        <button data-structured="slideshow"><b>Slideshow</b><small>fotos/vídeos</small></button>
      </div></details>
      <details><summary class="tool" title="Botão" aria-label="Botão"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="12" x="2" y="6" rx="2" /></svg></summary><div class="menu">
        <button data-button="url"><b>URL</b><small>link</small></button>
        <button data-button="callback_data"><b>Callback</b><small>1–64 bytes</small></button>
        <button data-button="web_app"><b>Mini App</b><small>web_app</small></button>
        <button data-button="login_url"><b>Login</b><small>login_url</small></button>
        <button data-button="switch_inline_query"><b>Inline query</b><small>escolher chat</small></button>
        <button data-button="switch_inline_query_current_chat"><b>Inline atual</b><small>chat atual</small></button>
        <button data-button="switch_inline_query_chosen_chat"><b>Inline escolhido</b><small>tipos de chat</small></button>
        <button data-button="copy_text"><b>Copiar</b><small>clipboard</small></button>
        <button data-button="disabled"><b>Desativado</b><small>sem ação</small></button>
        <button data-structured="button_row"><b>Linha de botões</b><small>alinhamento</small></button>
      </div></details>
      <button class="tool" id="undo" type="button" title="Desfazer" aria-label="Desfazer"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5" /> <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" /></svg></button>
      <button class="tool" id="redo" type="button" title="Refazer" aria-label="Refazer"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5" /> <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13" /></svg></button>
    </nav>
  </header>

  <main class="editor-wrap">
    <section id="editor" class="editor" contenteditable="true" spellcheck="true" aria-label="Editor Rich"></section>
    <section id="telegram-preview" class="telegram-preview hidden" aria-label="Prévia Telegram"></section>
  </main>

  <footer class="bottom">
    <button class="action" id="open-library" type="button" title="Rascunhos e importar" aria-label="Rascunhos e importar"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></svg></button>
    <div class="destination" role="group" aria-label="Destino de publicação">
      <button class="action primary" id="publish-telegram" type="button">Telegram</button>
      <button class="action primary" id="publish-telegraph" type="button">Telegraph</button>
    </div>
    <input id="file" type="file" accept=".md,.txt,text/plain" hidden>
    <input id="media-file" type="file" hidden>
  </footer>
  <div id="library-menu" class="menu" hidden>
    <button id="new-draft" type="button"><b>Novo</b><small>rascunho vazio</small></button>
    <button id="open-drafts" type="button"><b>Rascunhos</b><small>continuar</small></button>
    <button id="open-publications" type="button"><b>Publicações</b><small>histórico</small></button>
    <button id="import-file" type="button"><b>Importar .md/.txt</b><small>até 1 MB</small></button>
  </div>
</div>

<dialog id="resume-dialog">
  <div class="dialog-head"><h2>Continuar trabalho</h2></div>
  <div class="dialog-body"><p>Há rascunhos anteriores. Continue o mais recente ou comece um novo; o anterior será preservado.</p><div id="resume-summary" class="muted"></div></div>
  <div class="dialog-actions"><button value="new">Novo</button><button class="primary" value="continue">Continuar</button></div>
</dialog>

<dialog id="drafts-dialog"><div class="dialog-head"><h2>Rascunhos</h2><button data-close>Fechar</button></div><div class="dialog-body" id="drafts-list"></div><div class="dialog-actions"><button id="toggle-archived">Ver arquivados</button></div></dialog>
<dialog id="publications-dialog"><div class="dialog-head"><h2>Publicações</h2><button data-close>Fechar</button></div><div class="dialog-body" id="publications-list"></div></dialog>

<dialog id="form-dialog"><form method="dialog" id="form"><div class="dialog-head"><h2 id="form-title">Editar</h2><button value="cancel">Fechar</button></div><div class="dialog-body" id="form-fields"></div><div class="dialog-actions"><button value="cancel">Cancelar</button><button class="primary" value="save">Aplicar</button></div></form></dialog>

<dialog id="review-dialog"><div class="dialog-head"><h2 id="review-title">Revisão</h2><button data-close>Fechar</button></div><div class="dialog-body"><div id="review-metrics" class="muted"></div><div id="review-warnings" class="warnings"></div><h3>Resultado exato</h3><pre id="review-content" class="review-box"></pre></div><div class="dialog-actions"><button data-close>Cancelar</button><button class="primary" id="review-confirm">Confirmar publicação</button></div></dialog>

<dialog id="message-dialog"><div class="dialog-head"><h2 id="message-title">MDTXTRT</h2></div><div class="dialog-body" id="message-body"></div><div class="dialog-actions"><button class="primary" data-close>OK</button></div></dialog>

<script type="module" src="/static/app.js"></script>
<script type="module" src="/static/lifecycle_ui.js"></script>
</body>
</html>
