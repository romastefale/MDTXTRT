name: Sync fail-closed UI bundle

on:
  push:
    branches:
      - hardening/fail-closed-editor-drafts

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/fail-closed-editor-drafts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - name: Commit generated UI bundle and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js
          git rm .github/workflows/sync-fail-closed-ui.yml
          git commit -m "Build: sincronizar UI após hardening fail-closed"
          git push origin HEAD:hardening/fail-closed-editor-drafts
