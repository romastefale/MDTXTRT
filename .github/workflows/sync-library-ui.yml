name: Sync library UI bundle

on:
  push:
    branches: [fix/library-modal-robustness]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/library-modal-robustness
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - run: test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run build:ui
      - name: Update UI cache buster
        shell: bash
        run: |
          sha="$(git hash-object ui.js | cut -c1-12)"
          node -e "const fs=require('fs');const p='index.html';let s=fs.readFileSync(p,'utf8');s=s.replace(/ui\\.js\\?v=[a-f0-9]{12}/,'ui.js?v='+process.argv[1]);fs.writeFileSync(p,s)" "$sha"
      - name: Commit generated UI
        shell: bash
        run: |
          if git diff --quiet -- ui.js index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js index.html
          git commit -m "build: sync library UI bundle"
          git push origin HEAD:fix/library-modal-robustness
