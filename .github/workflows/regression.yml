name: Regression verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - name: Detect editor core input changes
        id: editor_inputs
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- src/editor-core.mjs package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild editor core
        if: steps.editor_inputs.outputs.changed == 'true'
        run: npm run build:editor
      - name: Verify committed editor core
        if: steps.editor_inputs.outputs.changed == 'true'
        run: git diff --exit-code -- editor-core.js
      - name: Detect UI source changes
        id: ui_inputs
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- src/liquid-glass-ui.jsx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild UI
        if: steps.ui_inputs.outputs.changed == 'true'
        run: npm run build:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.ui_inputs.outputs.changed == 'true'
        with:
          name: react-ui-bundle
          path: ui.js
          if-no-files-found: error
      - name: Verify committed UI
        if: steps.ui_inputs.outputs.changed == 'true'
        run: git diff --exit-code -- ui.js
      - run: npm test
