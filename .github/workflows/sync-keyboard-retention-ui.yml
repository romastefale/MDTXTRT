name: Sync keyboard retention UI bundle

on:
  push:
    branches: [fix/preserve-keyboard-menu-navigation]
    paths:
      - app.js
      - src/liquid-glass-ui.jsx
      - .github/workflows/sync-keyboard-retention-ui.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - run: test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run build:ui
      - name: Update UI cache buster
        shell: bash
        run: |
          blob="$(git hash-object ui.js)"
          short="${blob:0:12}"
          SHORT="$short" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const path='index.html';
          const short=process.env.SHORT;
          const html=fs.readFileSync(path,'utf8').replace(/ui\.js\?v=[a-f0-9]+/,'ui.js?v='+short);
          fs.writeFileSync(path,html);
          NODE
      - name: Commit generated UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: synchronize keyboard retention UI"
          git push
