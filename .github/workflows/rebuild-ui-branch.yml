name: Temporary branch UI rebuild

on:
  push:
    branches:
      - feat/bot-private-draft-actions

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/bot-private-draft-actions
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - run: test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run build:ui
      - name: Commit regenerated UI bundle
        shell: bash
        run: |
          if git diff --quiet -- ui.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js
          git commit -m "build: regenerate UI bundle"
          git push origin HEAD:feat/bot-private-draft-actions
