name: Align release UI bundle

on:
  push:
    branches:
      - release/final-gap-analysis

permissions:
  contents: write

concurrency:
  group: align-release-ui
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - name: Rebuild UI in contracted runner
        run: npm run build:ui
      - name: Commit runner-produced bundle and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js
          git rm .github/workflows/align-release-ui.yml
          git diff --cached --exit-code && { echo "Nothing to align"; exit 1; } || true
          git commit -m "build: align UI bundle with contracted Actions runner"
          git push origin HEAD:release/final-gap-analysis
