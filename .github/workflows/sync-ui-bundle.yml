name: Sync UI bundle

on:
  push:
    branches:
      - fix/editor-publication-fidelity

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editor-publication-fidelity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - name: Commit generated UI bundle and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js
          git rm .github/workflows/sync-ui-bundle.yml
          git commit -m "Build: sincronizar bundle da UI"
          git push origin HEAD:fix/editor-publication-fidelity
