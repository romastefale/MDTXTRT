name: Generate stage 3 browser artifacts

on:
  push:
    branches: [fix/evolution-3-editor-core]

permissions:
  contents: write

jobs:
  artifacts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run build
      - name: Refresh cache keys
        shell: bash
        run: |
          UI_SHA="$(git hash-object ui.js | cut -c1-12)"
          CORE_SHA="$(git hash-object editor-core.js | cut -c1-12)"
          perl -0pi -e "s/ui\.js\?v=[a-f0-9]{12}/ui.js?v=$UI_SHA/" index.html
          perl -0pi -e "s/editor-core\.js(?:\?v=[a-f0-9]{12})?/editor-core.js?v=$CORE_SHA/" index.html
      - name: Commit generated browser artifacts
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- ui.js editor-core.js index.html)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js editor-core.js index.html
          git commit -m "build: refresh stage 3 browser artifacts"
          git push
