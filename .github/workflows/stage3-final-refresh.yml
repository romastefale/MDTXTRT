name: Refresh final stage 3 editor artifact

on:
  push:
    branches: [fix/evolution-3-editor-core]

permissions:
  contents: write

jobs:
  artifact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run build:editor
      - name: Refresh cache buster
        shell: bash
        run: |
          sha="$(git hash-object editor-core.js | cut -c1-12)"
          sed -E -i "s/editor-core\.js\?v=[a-f0-9]{12}/editor-core.js?v=$sha/" index.html
      - name: Commit generated artifact
        shell: bash
        run: |
          if git diff --quiet -- editor-core.js index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor-core.js index.html
          git commit -m "build: refresh final stage 3 editor artifact"
          git push
