name: Sync anchored link interactions bundle

on:
  push:
    branches: [fix/anchored-link-interactions]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/anchored-link-interactions
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Refresh bundle cache keys
        shell: bash
        run: |
          editor_blob="$(git hash-object editor-core.js)"
          editor_short="${editor_blob:0:12}"
          ui_blob="$(git hash-object ui.js)"
          ui_short="${ui_blob:0:12}"
          sed -E -i "s#editor-core\.js\?v=[a-f0-9]{12}#editor-core.js?v=${editor_short}#" index.html
          sed -E -i "s#ui\.js\?v=[a-f0-9]{12}#ui.js?v=${ui_short}#" index.html
      - name: Commit deterministic bundles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor-core.js ui.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync anchored link interaction bundle"
          git push origin HEAD:fix/anchored-link-interactions
