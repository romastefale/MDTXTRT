name: Sync UI bundle once

on:
  push:
    branches:
      - design/bar-glass-tuning
    paths:
      - .github/workflows/sync-ui-bundle-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/bar-glass-tuning
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Refresh UI cache key
        shell: bash
        run: |
          key="$(git hash-object ui.js | cut -c1-12)"
          python - "$key" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path("index.html")
          s = p.read_text()
          s2, n = re.subn(r'ui\.js\?v=[a-f0-9]{12}', f'ui.js?v={sys.argv[1]}', s)
          if n != 1:
              raise SystemExit(f"expected one ui.js cache key, got {n}")
          p.write_text(s2)
          PY
      - name: Commit generated bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync generated UI bundle"
          git push origin HEAD:design/bar-glass-tuning
