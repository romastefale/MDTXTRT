name: Promote generated UI once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: promote-generated-ui-once
  cancel-in-progress: true

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - run: test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run build
      - name: Promote deterministic bundle, refresh cache key and remove one-shot workflow
        run: |
          sha="$(git hash-object ui.js | cut -c1-12)"
          perl -0pi -e 's/ui\.js\?v=[a-f0-9]+/ui.js?v='"$sha"'/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js index.html
          git rm .github/workflows/promote-generated-ui-once.yml
          git commit -m "Promote Markdown caret preservation"
          git push origin HEAD:main
