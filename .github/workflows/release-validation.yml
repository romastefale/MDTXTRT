name: Release validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  automated:
    name: Automated release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_CANDIDATE_SHA }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_CANDIDATE_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Verify contracted npm
        run: test "$(npm --version)" = "11.19.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild all committed bundles
        run: npm run build

      - name: Preserve rebuilt bundle evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-rebuilt-bundles-${{ env.RELEASE_CANDIDATE_SHA }}
          path: |
            editor-core.js
            ui.js
          retention-days: 7

      - name: Verify reproducible committed bundles
        run: git diff --exit-code -- editor-core.js ui.js

      - name: Run complete regression suite
        run: npm test

