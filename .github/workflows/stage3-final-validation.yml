name: Stage 3 final validation

on:
  push:
    branches: [fix/evolution-3-editor-core]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - name: Rebuild committed browser bundles
        run: npm run build
      - name: Verify committed browser bundles
        run: git diff --exit-code -- editor-core.js ui.js
      - run: npm test
