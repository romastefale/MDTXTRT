name: Sync Telegram fullscreen orientation bundle

on:
  push:
    branches: [fix/telegram-fullscreen-orientation-geometry]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/telegram-fullscreen-orientation-geometry
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - run: test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run build:ui
      - name: Refresh UI cache key
        shell: bash
        run: |
          blob="$(git hash-object ui.js)"
          short="${blob:0:12}"
          sed -E -i "s#ui\.js\?v=[a-f0-9]{12}#ui.js?v=${short}#" index.html
      - run: npm test
      - name: Commit deterministic UI bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync Telegram fullscreen orientation bundle"
          git push origin HEAD:fix/telegram-fullscreen-orientation-geometry
