name: Sync product polish editor bundle

on:
  push:
    branches: [fix/product-polish-followup]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/product-polish-followup
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - run: test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run build:editor
      - run: npm test
      - name: Commit rebuilt editor bundle
        shell: bash
        run: |
          rm .github/workflows/sync-product-polish-editor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor-core.js .github/workflows/sync-product-polish-editor.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: sync product polish editor bundle"
          git push
