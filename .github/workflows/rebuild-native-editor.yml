name: Temporary native editor rebuild

on:
  push:
    branches:
      - feat/canonical-editor-platform-contracts

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/canonical-editor-platform-contracts
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build
      - name: Update browser bundle cache keys
        shell: bash
        run: |
          EDITOR_SHA="$(git hash-object editor-core.js | cut -c1-12)"
          UI_SHA="$(git hash-object ui.js | cut -c1-12)"
          EDITOR_SHA="$EDITOR_SHA" UI_SHA="$UI_SHA" node -e "const fs=require('fs');let s=fs.readFileSync('index.html','utf8');s=s.replace(/editor-core\\.js\\?v=[a-f0-9]{12}/,'editor-core.js?v='+process.env.EDITOR_SHA).replace(/ui\\.js\\?v=[a-f0-9]{12}/,'ui.js?v='+process.env.UI_SHA);fs.writeFileSync('index.html',s)"
      - run: npm test
      - name: Commit lockfile and bundles
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json editor-core.js ui.js index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json editor-core.js ui.js index.html
          git commit -m "build: regenerate native editor artifacts"
          git push origin HEAD:feat/canonical-editor-platform-contracts
