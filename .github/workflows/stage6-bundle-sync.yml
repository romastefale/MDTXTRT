name: Stage 6 bundle synchronization

on:
  push:
    branches:
      - fix/evolution-6-volume-drafts-provenance-ui

permissions:
  contents: write

concurrency:
  group: stage6-bundle-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/evolution-6-volume-drafts-provenance-ui
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Verify contracted npm
        run: test "$(npm --version)" = "11.19.0"
      - name: Install locked dependencies
        run: npm ci
      - name: Rebuild committed bundles
        run: npm run build
      - name: Verify editor bundle unchanged
        run: git diff --exit-code -- editor-core.js
      - name: Synchronize UI cache key
        shell: bash
        run: |
          sha="$(git hash-object ui.js | cut -c1-12)"
          sed -E -i "s#ui\.js\?v=[a-f0-9]{12}#ui.js?v=$sha#" index.html
          grep -F "ui.js?v=$sha" index.html
      - name: Run complete regression suite
        run: npm test
      - name: Verify whitespace
        run: git diff --check
      - name: Remove one-shot workflow
        run: rm .github/workflows/stage6-bundle-sync.yml
      - name: Commit reproducible UI artifact
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js index.html .github/workflows/stage6-bundle-sync.yml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Etapa 6/7: sincronizar bundle UI reproduzível"
          git push origin HEAD:fix/evolution-6-volume-drafts-provenance-ui
