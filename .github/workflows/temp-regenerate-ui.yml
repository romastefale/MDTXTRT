name: Temporary UI bundle regeneration

on:
  push:
    branches:
      - fix/keep-keyboard-open

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/keep-keyboard-open
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - name: Sync UI cache buster
        shell: bash
        run: |
          short_sha="$(git hash-object ui.js | cut -c1-12)"
          SHORT_SHA="$short_sha" node --input-type=module -e '
            import fs from "node:fs";
            const file = "index.html";
            const html = fs.readFileSync(file, "utf8");
            const next = html.replace(/ui\.js\?v=[a-f0-9]+/, "ui.js?v=" + process.env.SHORT_SHA);
            if (next === html) throw new Error("ui.js cache buster not found");
            fs.writeFileSync(file, next);
          '
      - name: Commit rebuilt bundle
        shell: bash
        run: |
          if git diff --quiet -- ui.js index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js index.html
          git commit -m "chore: commit rebuilt UI bundle"
          git push origin HEAD:fix/keep-keyboard-open
