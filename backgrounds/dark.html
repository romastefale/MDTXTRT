<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dark Background</title>

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  min-height: 100%;
}

html {
  background: #12131c;
}

body {
  min-height: 100dvh;

  background:
    radial-gradient(
      95% 32% at -12% 0%,
      rgba(48, 27, 51, 0.42) 0%,
      rgba(34, 24, 42, 0.24) 38%,
      rgba(18, 20, 29, 0) 76%
    ),

    radial-gradient(
      86% 34% at 112% 17%,
      rgba(61, 34, 49, 0.42) 0%,
      rgba(43, 27, 41, 0.24) 42%,
      rgba(18, 20, 29, 0) 78%
    ),

    radial-gradient(
      104% 42% at -23% 39%,
      rgba(19, 72, 66, 0.52) 0%,
      rgba(18, 52, 52, 0.34) 36%,
      rgba(17, 31, 39, 0.14) 62%,
      rgba(17, 21, 30, 0) 83%
    ),

    radial-gradient(
      90% 33% at 114% 45%,
      rgba(48, 31, 43, 0.29) 0%,
      rgba(33, 27, 39, 0.16) 48%,
      rgba(17, 21, 30, 0) 80%
    ),

    radial-gradient(
      94% 38% at -20% 78%,
      rgba(26, 52, 77, 0.43) 0%,
      rgba(21, 39, 58, 0.27) 42%,
      rgba(17, 23, 34, 0.11) 66%,
      rgba(17, 20, 29, 0) 86%
    ),

    radial-gradient(
      84% 30% at 111% 91%,
      rgba(46, 31, 43, 0.26) 0%,
      rgba(33, 27, 39, 0.14) 49%,
      rgba(18, 20, 29, 0) 82%
    ),

    linear-gradient(
      180deg,
      #12131c 0%,
      #111720 31%,
      #10171d 50%,
      #10151d 69%,
      #11131c 100%
    );

  background-repeat: no-repeat;
  background-size: 100% 100%;
  background-attachment: fixed;
}
</style>
</head>

<body></body>
</html>
