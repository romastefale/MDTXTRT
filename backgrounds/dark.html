<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dark Background</title>
<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  min-height: 100%;
  background: #000;
}
body {
  min-height: 100dvh;

  background-image:

    radial-gradient(86% 34% at 112% 17%, rgba(68, 68, 68, .31) 0%, rgba(39, 39, 39, .18) 42%, transparent 78%),
    radial-gradient(104% 42% at -23% 39%, rgba(58, 58, 58, .34) 0%, rgba(34, 34, 34, .23) 36%, rgba(20, 20, 20, .1) 62%, transparent 83%),
    radial-gradient(90% 33% at 114% 45%, rgba(54, 54, 54, .22) 0%, rgba(32, 32, 32, .14) 48%, transparent 80%),
    radial-gradient(94% 38% at -20% 78%, rgba(72, 72, 72, .3) 0%, rgba(42, 42, 42, .2) 42%, rgba(22, 22, 22, .1) 66%, transparent 86%),
    radial-gradient(84% 30% at 111% 91%, rgba(56, 56, 56, .21) 0%, rgba(34, 34, 34, .13) 49%, transparent 82%);

  background-size: 100% 100%;
  background-attachment: fixed;
}
</style>
</head>
