<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dark Background</title>

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  min-height: 100%;
}

html {
  background: #0f172a;
}

body {
  min-height: 100dvh;

  background:
    radial-gradient(
      95% 32% at -12% 0%,
      rgba(71, 78, 104, 0.38) 0%,
      rgba(52, 62, 83, 0.22) 38%,
      rgba(15, 23, 42, 0) 76%
    ),

    radial-gradient(
      86% 34% at 112% 17%,
      rgba(58, 75, 104, 0.40) 0%,
      rgba(46, 61, 83, 0.22) 42%,
      rgba(18, 20, 29, 0) 78%
    ),

    radial-gradient(
      104% 42% at -23% 39%,
      rgba(35, 68, 91, 0.46) 0%,
      rgba(29, 53, 75, 0.30) 36%,
      rgba(27, 43, 62, 0.14) 62%,
      rgba(15, 23, 42, 0) 83%
    ),

    radial-gradient(
      90% 33% at 114% 45%,
      rgba(55, 64, 88, 0.27) 0%,
      rgba(39, 52, 74, 0.16) 48%,
      rgba(17, 21, 30, 0) 80%
    ),

    radial-gradient(
      94% 38% at -20% 78%,
      rgba(47, 67, 95, 0.42) 0%,
      rgba(35, 53, 79, 0.26) 42%,
      rgba(24, 39, 62, 0.11) 66%,
      rgba(15, 23, 42, 0) 86%
    ),

    radial-gradient(
      84% 30% at 111% 91%,
      rgba(53, 60, 83, 0.24) 0%,
      rgba(38, 49, 70, 0.14) 49%,
      rgba(18, 20, 29, 0) 82%
    ),

    linear-gradient(
      180deg,
       #0f172a 0%,
      #131d30 31%,
      #182438 50%,
      #141f32 69%,
      #0f172a 100%
    );

  background-repeat: no-repeat;
  background-size: 100% 100%;
  background-attachment: fixed;
}
</style>
</head>

<body></body>
</html>
