<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Light Background</title>

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  min-height: 100%;
}

html {
  background: #f8fbff;
}

body {
  min-height: 100dvh;

  background:
    radial-gradient(
      92% 30% at -10% 0%,
      rgba(246, 236, 255, 0.72) 0%,
      rgba(248, 243, 255, 0.42) 44%,
      rgba(250, 251, 255, 0) 78%
    ),

    radial-gradient(
      84% 30% at 112% 19%,
      rgba(255, 237, 245, 0.78) 0%,
      rgba(255, 247, 250, 0.42) 47%,
      rgba(250, 252, 255, 0) 80%
    ),

    radial-gradient(
      100% 38% at -18% 40%,
      rgba(230, 255, 248, 0.88) 0%,
      rgba(239, 255, 251, 0.56) 39%,
      rgba(248, 253, 255, 0.18) 63%,
      rgba(250, 252, 255, 0) 84%
    ),

    radial-gradient(
      96% 40% at 56% 49%,
      rgba(231, 246, 255, 0.88) 0%,
      rgba(240, 249, 255, 0.58) 46%,
      rgba(248, 252, 255, 0.18) 69%,
      rgba(250, 252, 255, 0) 86%
    ),

    radial-gradient(
      82% 31% at 112% 72%,
      rgba(247, 244, 255, 0.52) 0%,
      rgba(250, 248, 255, 0.30) 49%,
      rgba(250, 252, 255, 0) 82%
    ),

    radial-gradient(
      76% 28% at 108% 100%,
      rgba(255, 247, 242, 0.70) 0%,
      rgba(255, 251, 248, 0.38) 48%,
      rgba(250, 252, 255, 0) 81%
    ),

    radial-gradient(
      42% 16% at 57% 98%,
      rgba(229, 252, 255, 0.46) 0%,
      rgba(242, 253, 255, 0.20) 54%,
      rgba(250, 252, 255, 0) 82%
    ),

    linear-gradient(
      180deg,
      #faf8fe 0%,
      #f7fbff 28%,
      #f4fbff 52%,
      #f8fbff 78%,
      #fbfaff 100%
    );

  background-repeat: no-repeat;
  background-size: 100% 100%;
  background-attachment: fixed;
}
</style>
</head>

<body></body>
</html>
