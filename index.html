<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MDTXTRT" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" id="themeColor" content="#f8fbff" />
  <title>MDTXTRT</title>
  <meta name="description" content="Editor de texto para Telegram e Telegraph." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="logo.svg" />
  <meta property="og:title" content="MDTXTRT" />
  <meta property="og:description" content="Editor de texto para Telegram e Telegraph" />
  <meta property="og:image" content="https://romastefale.github.io/MDTXTRT/og.jpg" />
  <meta property="og:url" content="https://romastefale.github.io/MDTXTRT/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://romastefale.github.io/MDTXTRT/x-banner.jpg" />
  <script>const q=matchMedia("(prefers-color-scheme: light)"),h=document.documentElement,m=document.querySelector("#themeColor"),l=q.matches;h.classList.add(l?"light":"dark");m.content=l?"#f8fbff":"#000000";</script>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root{
      --bg:#000;
      --text:#f5f5f7;
      --accent:#2B88D8;
      --muted:color-mix(in oklab,var(--text) 82%,var(--accent));
      --neutral-1:color-mix(in oklab,var(--accent) 6%,var(--bg));
      --neutral-2:color-mix(in oklab,var(--accent) 10%,var(--bg));
      --neutral-3:color-mix(in oklab,var(--accent) 16%,var(--bg));
      --neutral-4:color-mix(in oklab,var(--accent) 24%,var(--bg));
      --line:color-mix(in oklab,var(--accent) 22%,var(--bg));
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --safe-right:env(safe-area-inset-right,0px);
      --gap:8px;
      --topbar-h:36px;
      --meta-h:52px;
      --bar-h:46px;
      --vv-top:0px;
      --vv-bottom:0px;
      --vv-height:100dvh;
      --bottom:var(--safe-bottom);
      --head-inset:calc(var(--safe-top) + var(--gap) + var(--topbar-h) + var(--gap) + var(--meta-h) + var(--gap));
      --foot-inset:calc(var(--bottom) + var(--gap) + var(--bar-h) + var(--gap));
    }
    html.tg-shell{
      --safe-top:max(var(--tg-safe-area-inset-top),var(--tg-content-safe-area-inset-top));
      --safe-bottom:max(var(--tg-safe-area-inset-bottom),var(--tg-content-safe-area-inset-bottom));
      --safe-left:max(var(--tg-safe-area-inset-left),var(--tg-content-safe-area-inset-left));
      --safe-right:max(var(--tg-safe-area-inset-right),var(--tg-content-safe-area-inset-right));
      --head-inset:calc(var(--safe-top) + var(--gap) + var(--meta-h) + var(--gap));
    }
    html.light{
      --bg:#f8fbff; --text:#151515; --accent:#FF4BA0;
    }
    html{color-scheme:light dark;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    html.light{color-scheme:light}
    html.dark{color-scheme:dark}
    *{box-sizing:border-box;scrollbar-width:none}
    *::-webkit-scrollbar{width:0;height:0;display:none}
    html,body{margin:0;width:100%;min-height:100svh;overflow:clip}
    html[data-keyboard]{--bottom:0px}
    html{background:var(--bg)}
    body{
      padding:0;color:var(--text);background:transparent;overscroll-behavior:none;touch-action:pan-x pan-y;
      accent-color:var(--accent);caret-color:var(--accent);
      font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif
    }
    .bg{
      position:fixed;top:0;left:0;width:100%;height:100lvh;z-index:0;pointer-events:none;
      background:var(--bg)
    }
    .device-gate{
      display:none;position:fixed;inset:0;z-index:100;
      place-items:center;padding:32px;text-align:center;background:var(--bg);color:var(--text)
    }
    .device-gate-card{max-width:320px}
    .device-gate strong{display:block;font-size:20px;line-height:1.2;letter-spacing:-.02em}
    .device-gate p{margin:10px 0 0;color:var(--muted);font-size:15px;line-height:1.45}
    html[data-device-gate] .device-gate{display:grid}
    ::selection{background:color-mix(in srgb,var(--accent) 38%, transparent);color:inherit}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    :where(button,input,textarea,[contenteditable="true"]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .editor:focus-visible{outline-offset:4px}
    .ui-icon{display:block;width:18px;height:18px;flex:none;background-color:currentColor;-webkit-mask:var(--ui-icon) center/contain no-repeat;mask:var(--ui-icon) center/contain no-repeat}
    .seg button .ui-icon,.action-dot .ui-icon,.sheet-ico .ui-icon{width:16px;height:16px}
    .editor h1,.editor h2,.editor h3,.editor h4,.editor h5,.editor h6{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.03em;line-height:1.2;font-weight:650}
    .editor h1{font-size:28px;font-weight:750;margin:0 0 .45em}
    .editor h2{font-size:24px;margin:.95em 0 .4em}
    .editor h3{font-size:20px;margin:.9em 0 .35em}
    .editor h4{font-size:18px;margin:.85em 0 .3em}
    .editor h5{font-size:14px;letter-spacing:.02em;margin:.85em 0 .3em}
    .editor h6{font-size:12px;letter-spacing:.03em;color:var(--muted);margin:.85em 0 .3em}
    .editor .tg-footer,.editor footer{display:block;font-size:12px;color:var(--muted);margin:1.6em 0 .4em;padding-top:.7em;border-top:1px solid var(--line);font-weight:400}
    .menu-list button.is-current{background:color-mix(in srgb,var(--accent) 16%, transparent);color:var(--accent)}
    .heading-list .h-opt.h1{font-size:20px;font-weight:750;letter-spacing:-.03em}
    .heading-list .h-opt.h2{font-size:17px;font-weight:650}
    .heading-list .h-opt.h3{font-size:15px;font-weight:650}
    .heading-list .h-opt.h4{font-size:14px;font-weight:650}
    .heading-list .h-opt.h5{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase}
    .heading-list .h-opt.h6{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .heading-list .h-opt.footer{font-size:12px;color:var(--muted)}
    .heading-list button.is-current{color:var(--accent)}
    .brand-glass,.seg,.bar{color:#151515}
    .brand-glass,.seg,.bar{border-radius:999px}
    .fade-top,.fade-bot{
      position:fixed;left:0;right:0;z-index:20;pointer-events:none;
      transform:translateZ(0);backface-visibility:hidden;contain:paint;
      background-repeat:no-repeat
    }
    .fade-top{
      top:var(--vv-top);height:calc(var(--head-inset) + 20px);
      background:linear-gradient(180deg,var(--bg) 0,var(--bg) calc(var(--safe-top) + var(--gap)),color-mix(in srgb,var(--bg) 78%,transparent) 52%,color-mix(in srgb,var(--bg) 42%,transparent) 76%,transparent 100%)
    }
    .fade-bot{
      top:auto;bottom:var(--vv-bottom);
      height:calc(var(--foot-inset) + 20px);
      background:linear-gradient(0deg,var(--bg) 0,var(--bg) calc(var(--bottom) + var(--gap)),color-mix(in srgb,var(--bg) 78%,transparent) 52%,color-mix(in srgb,var(--bg) 42%,transparent) 76%,transparent 100%)
    }
    .app{display:contents}
    .chrome-top{display:contents}
    .chrome-top .topbar,.chrome-top .meta{pointer-events:auto}
    body.tg .topbar{display:none}
    .topbar{
      position:fixed;z-index:30;top:calc(var(--vv-top) + var(--safe-top) + var(--gap));left:50%;transform:translate3d(-50%,0,0);backface-visibility:hidden;
      display:flex;align-items:center;justify-content:center;height:var(--topbar-h);width:max-content;margin:0;padding:0
    }
    .brand-glass{width:max-content}
    .brand{font-weight:700;font-size:15px;letter-spacing:.08em;text-align:center;border:0;color:inherit;background:transparent;padding:8px 12px;margin:0;border-radius:999px;font-family:inherit;appearance:none;-webkit-appearance:none}
    .meta{
      position:fixed;z-index:30;top:calc(var(--vv-top) + var(--safe-top) + var(--gap) + var(--topbar-h) + var(--gap));
      left:max(16px,var(--safe-left));right:max(16px,var(--safe-right));
      transform:translateZ(0);backface-visibility:hidden;
      display:flex;align-items:center;justify-content:space-between;gap:var(--gap);height:var(--meta-h);margin:0
    }
    html.tg-shell .meta{top:calc(var(--vv-top) + var(--safe-top) + var(--gap))}
    .meta .seg:last-child{margin-left:auto}
    .seg{display:flex;align-items:center;gap:4px;padding:4px;height:var(--meta-h);border-radius:999px}
    .seg button{
      width:calc(var(--meta-h) - 8px);height:calc(var(--meta-h) - 8px);border:0;border-radius:50%;background:transparent;display:grid;place-items:center
    }
    .seg button.active{background:var(--neutral-3);color:var(--accent)}
    .seg #destBtn{position:relative;background:var(--neutral-2);color:var(--accent)}
    .seg #destBtn .ui-icon{position:absolute;inset:0;width:32px;height:32px;margin:auto;transform:none}
    .seg #destBtn.active{background:var(--neutral-4)}
    .seg button.is-flash{position:relative}
    .seg button.is-flash::before{content:"";position:absolute;inset:0;width:36px;height:36px;margin:auto;border-radius:50%;background:var(--neutral-3);z-index:0;animation:flash-out 1.4s ease forwards}
    .seg button.is-flash > *{position:relative;z-index:1}
    @keyframes flash-out{0%,35%{opacity:1}100%{opacity:0}}
    .bar > button{position:relative}
    .bar > button.on{background:transparent;color:var(--accent)}
    .bar > button.on::before{content:"";position:absolute;inset:0;width:36px;height:36px;margin:auto;border-radius:50%;background:var(--neutral-3);z-index:0}
    .bar > button > *{position:relative;z-index:1}
    .canvas{
      position:fixed;z-index:10;left:0;right:0;top:var(--vv-top);height:var(--vv-height);
      overflow:hidden;pointer-events:none
    }
    .scroll{
      position:absolute;
      top:0;bottom:0;
      padding-top:var(--head-inset);padding-bottom:var(--foot-inset);
      scroll-padding-top:var(--head-inset);scroll-padding-bottom:var(--foot-inset);
      left:max(16px,var(--safe-left));right:max(16px,var(--safe-right));
      overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;
      -webkit-overflow-scrolling:touch;touch-action:pan-y;pointer-events:auto
    }
    .editor:empty::before{content:attr(data-placeholder);color:var(--muted);pointer-events:none}
    .editor{
      outline:none;min-height:100%;caret-color:var(--accent);font-size:16px;
      -webkit-user-select:text;user-select:text
    }
    .editor p{margin:.7em 0}
    .editor blockquote{margin:1em 0;padding:0 0 0 12px;border-left:3px solid var(--accent)}
    .editor ul{padding-left:1.2em}
    .editor table{width:100%;border-collapse:collapse;font-size:14px}
    .editor th,.editor td{border:1px solid var(--line);padding:6px}
    .editor a{color:var(--accent)}
    .editor img,.editor video,.editor iframe{max-width:100%;height:auto}
    .editor figure{margin:1em 0;padding:8px;border:1px solid var(--line);border-radius:18px;background:var(--neutral-1);overflow:hidden}
    .editor figure>img,.editor figure>video,.editor figure>iframe{display:block;width:100%;border-radius:12px;background:var(--neutral-2)}
    .editor figure>audio{display:block;width:100%;min-height:40px}
    .editor figcaption{font-size:13px;line-height:1.35;color:var(--muted);padding:8px 4px 2px}
    .editor tg-math{display:inline-block;max-width:100%;margin:0 .08em;padding:.12em .38em;border-radius:7px;background:color-mix(in srgb,var(--accent) 12%,transparent);font:500 .94em/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
    .editor tg-math-block{display:block;margin:1em 0;padding:12px 14px;border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:14px;background:color-mix(in srgb,var(--accent) 8%,transparent);font:500 14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:auto}
    .editor tg-button-row{display:flex;justify-content:center;gap:8px;margin:1em 0}
    .editor tg-button{display:inline-block;border-radius:12px;padding:8px 14px;background:var(--accent);color:#fff}
    .editor tg-document,.editor tg-map{display:block;margin:1em 0;padding:12px;border-radius:12px;background:var(--neutral-2)}
    .editor tg-document{min-height:48px;border:1px solid var(--line)}
    .editor tg-document::before{content:"Documento";font-weight:600}
    .editor tg-map::before{content:"Mapa"}
    .editor [data-media-missing]{display:block;min-height:96px;border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);border-radius:12px;background:color-mix(in srgb,var(--accent) 7%,transparent)}
    .editor [data-media-missing]::after{content:"Anexo salvo indisponível";display:grid;place-items:center;min-height:96px;color:var(--muted);font-size:13px}
    .editor tg-collage,.editor tg-slideshow{display:flex;flex-wrap:wrap;gap:8px;margin:1em 0}
    .editor tg-spoiler{background:var(--neutral-4);border-radius:4px}
    .bar-wrap{
      position:fixed;left:50%;right:auto;width:210px;max-width:calc(100vw - 24px);
      top:auto;bottom:calc(var(--vv-bottom) + var(--bottom) + var(--gap));z-index:30;
      transform:translate3d(-50%,0,0);backface-visibility:hidden;
      padding:0;background:transparent;pointer-events:none
    }
    .bar{
      position:relative;z-index:1;width:210px;max-width:calc(100vw - 24px);margin:0 auto;
      display:flex;align-items:center;overflow-x:auto;overscroll-behavior-inline:contain;
      height:var(--bar-h);padding:4px;border-radius:999px;pointer-events:auto
    }
    .bar > button{
      flex:0 0 38px;min-width:38px;height:38px;border:0;background:transparent;color:inherit;
      display:grid;place-items:center;border-radius:999px;padding:0
    }
    .bar .plus{flex:0 0 38px}
    .action-dot{
      width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
      background:var(--accent);color:#fff;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 4px 14px color-mix(in oklab,var(--accent) 45%,transparent)
    }
    .seg .export{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;padding:0;border-radius:50%}
    .seg .action-dot{width:40px;height:40px}
    .glass-menu{
      position:fixed;inset:0;z-index:40;margin:auto;
      width:min(210px,calc(100vw - 16px));height:max-content;
      max-height:min(55vh,420px);overflow:visible;padding:0;border:0;
      border-radius:9px;background:transparent;color:#151515
    }
    .glass-menu.wide-menu{width:min(260px,calc(100vw - 16px))}
    .glass-menu.dialog-menu,.glass-menu.find-menu{width:min(300px,calc(100vw - 16px))}
    .glass-menu:not(:popover-open){display:none}
    .glass-menu:popover-open{display:block;animation:glass-menu-in .14s cubic-bezier(.2,.75,.25,1)}
    @keyframes glass-menu-in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
    .glass-menu-lens{
      position:absolute!important;inset:0!important;width:100%!important;height:100%!important;
      border-radius:9px!important;pointer-events:none
    }
    .glass-menu-content{
      position:relative;z-index:1;max-height:min(55vh,420px);overflow:hidden;
      border-radius:9px;padding:5px 6px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 0 0 .5px rgba(0,0,0,.18),0 16px 40px rgba(0,0,0,.26),0 2px 6px rgba(0,0,0,.18)
    }
    .menu-list{
      display:flex;flex-direction:column;gap:0;min-height:0;max-height:calc(min(55vh,420px) - 10px);
      overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y
    }
    .menu-list > button{
      display:flex;align-items:center;justify-content:flex-start;text-align:left;
      width:100%;min-width:0;white-space:nowrap;height:24px;min-height:24px;
      border-radius:6px;border:0;background:transparent;box-shadow:none;
      padding:0 11px;font-size:13px;line-height:1;gap:8px;color:inherit
    }
    .menu-list > button[hidden]{display:none}
    .menu-list > button:hover,.menu-list > button:focus-visible{background:var(--accent);color:#fff}
    .menu-list > button:active{background:color-mix(in srgb,var(--accent) 86%,#000)}
    .sheet-ico{width:16px;height:16px;border-radius:4px;flex:none;display:grid;place-items:center;background:transparent;box-shadow:none}
    .sheet-ico .ui-icon,.sheet-ico svg{width:13px;height:13px}
    .glass-menu .heading-list .h-opt{font-size:13px;font-weight:500;letter-spacing:0;text-transform:none}
    .toast{
      position:fixed;left:50%;bottom:calc(var(--vv-bottom) + var(--foot-inset) + 8px);
      transform:translateX(-50%);z-index:50;display:none;min-width:80px;
      padding:7px 10px;border-radius:9px;font-size:12px;color:#151515
    }
    .toast.on{display:block}
    .toast-content{position:relative;z-index:1}
    .tools{display:flex;gap:6px;align-items:center;padding:4px;max-width:100%}
    .hint{max-width:240px;white-space:normal;margin:5px 8px 7px;font-size:12px;line-height:1.35}
    .tools input{
      min-width:0;width:100%;height:32px;border:0;border-radius:7px;
      background:rgba(255,255,255,.48);color:#151515;padding:0 9px;outline:0;font-size:13px
    }
    .tools button{
      min-height:30px;border:0;border-radius:6px;background:color-mix(in srgb,var(--accent) 18%,transparent);
      padding:0 9px;color:#151515;font-size:12px
    }
    .dialog{display:flex;flex-direction:column;gap:7px;width:100%;padding:3px}
    .dialog-label{font-size:12px;line-height:1.35;color:rgba(0,0,0,.62);padding:2px 4px}
    #dialogInput{
      width:100%;min-height:34px;max-height:112px;resize:none;border:0;border-radius:7px;
      background:rgba(255,255,255,.48);color:#151515;padding:8px 9px;outline:0;font:inherit;font-size:13px
    }
    #dialogInput[hidden]{display:none}
    .dialog-actions{display:flex;justify-content:flex-end;gap:5px}
    .dialog-actions button{min-height:30px;border:0;border-radius:6px;padding:0 10px;background:rgba(255,255,255,.35);color:#151515;font-size:12px}
    .dialog-actions #dialogOk{background:var(--accent);color:#fff}
    #findMenu .menu-list{gap:0;width:100%}
    #findMenu .tools:last-child{flex-wrap:wrap}
    #findMenu .tools button{flex:1 1 auto;white-space:nowrap}
    @media (prefers-reduced-motion:reduce){.glass-menu{animation:none}}
    @media (orientation:landscape),(min-width:760px){
      .device-gate{display:grid}
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="device-gate" id="deviceGate" role="dialog" aria-modal="true" aria-labelledby="deviceGateTitle" aria-describedby="deviceGateText">
    <div class="device-gate-card">
      <strong id="deviceGateTitle">Use no modo retrato</strong>
      <p id="deviceGateText">Este WebApp funciona apenas em smartphones no modo retrato. Gire o aparelho para continuar.</p>
    </div>
  </div>
  <div class="fade-top" aria-hidden="true"></div>
  <div class="fade-bot" aria-hidden="true"></div>
  <div class="app">
    <div id="ux-root"></div>
    <div class="canvas" id="canvas">
      <div class="scroll" id="scroll">
        <article id="editor" class="editor" contenteditable="true" spellcheck="true" inputmode="text" enterkeyhint="enter" aria-label="Editor" data-placeholder="Escreva aqui…"></article>
      </div>
    </div>
  </div>
  <script src="marked.js"></script>
  <script src="turndown.js"></script>
  <script type="module" src="ui.js?v=0f5f222fdab1"></script>
</body>
</html>
