<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>MDTXTRT</title>
  <meta name="description" content="md to rich text and telegraph editor — Mini App Telegram e Telegraph." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="logo.png" />
  <meta property="og:title" content="MDTXTRT" />
  <meta property="og:description" content="md to rich text and telegram editor" />
  <meta property="og:image" content="https://romastefale.github.io/MDTXTRT/og.jpg" />
  <meta property="og:url" content="https://romastefale.github.io/MDTXTRT/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://romastefale.github.io/MDTXTRT/x-banner.jpg" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>(function(){try{var t=window.Telegram&&window.Telegram.WebApp;var inTg=t&&((t.initData&&t.initData.length)||(t.initDataUnsafe&&t.initDataUnsafe.user&&t.initDataUnsafe.user.id));var l=inTg&&t.colorScheme?t.colorScheme==="light":matchMedia("(prefers-color-scheme: light)").matches;document.documentElement.classList.toggle("light",l);document.documentElement.classList.toggle("dark",!l);}catch(e){}})();</script>
  <style>
    :root{
      --bg:#12131c;
      --text:#f5f5f7;
      --muted:#c5c8d8;
      --accent:#8b5cf6;
      --bar:rgba(255,255,255,.08);
      --line:rgba(255,255,255,.18);
      --glass-frost:0.08;
      --glass-saturation:1.15;
      --glass:rgba(255,255,255,var(--glass-frost));
      --glass-edge:transparent;
      --glass-shadow:inset 0 .5px 0 rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.16),0 6px 18px rgba(0,0,0,.14),0 18px 40px rgba(0,0,0,.1);
      --glass-shadow-lg:inset 0 .5px 0 rgba(255,255,255,.14),0 2px 6px rgba(0,0,0,.14),0 12px 28px rgba(0,0,0,.16),0 28px 56px rgba(0,0,0,.12);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --tg-top:0px;
      --kb:0px;
      --vv-h:100dvh;
      --bar-h:52px; --top-blur:0;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f8fbff; --text:#151515; --muted:#5c6478; --accent:#ff6a00;
        --bar:rgba(255,255,255,.46); --line:rgba(255,255,255,.7);
        --glass-frost:0.22; --glass-saturation:1.15;
        --glass:rgba(255,255,255,var(--glass-frost));
        --glass-edge:transparent;
        --glass-shadow:inset 0 .5px 0 rgba(255,255,255,.45),0 1px 2px rgba(20,24,36,.04),0 8px 20px rgba(20,24,36,.07),0 18px 36px rgba(20,24,36,.05);
        --glass-shadow-lg:inset 0 .5px 0 rgba(255,255,255,.5),0 4px 12px rgba(20,24,36,.05),0 16px 32px rgba(20,24,36,.08),0 28px 48px rgba(20,24,36,.06);
      }
    }
    html.light{
      --bg:#f8fbff; --text:#151515; --muted:#5c6478; --accent:#ff6a00;
      --bar:rgba(255,255,255,.46); --line:rgba(255,255,255,.7);
      --glass-frost:0.22;
      --glass:rgba(255,255,255,var(--glass-frost));
      --glass-edge:transparent;
      --glass-shadow:inset 0 .5px 0 rgba(255,255,255,.45),0 1px 2px rgba(20,24,36,.04),0 8px 20px rgba(20,24,36,.07),0 18px 36px rgba(20,24,36,.05);
      --glass-shadow-lg:inset 0 .5px 0 rgba(255,255,255,.5),0 4px 12px rgba(20,24,36,.05),0 16px 32px rgba(20,24,36,.08),0 28px 48px rgba(20,24,36,.06);
    }
    html.dark{
      --bg:#12131c; --text:#f5f5f7; --muted:#c5c8d8; --accent:#8b5cf6;
      --bar:rgba(255,255,255,.08); --line:rgba(255,255,255,.18);
      --glass-frost:0.08; --glass:rgba(255,255,255,var(--glass-frost));
    }
    html{color-scheme:light dark}
    html.light{color-scheme:light}
    html.dark{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;min-height:100%;min-height:100dvh;touch-action:pan-x pan-y;-ms-touch-action:pan-x pan-y;accent-color:var(--accent);caret-color:var(--accent);background:none}
    body{
      padding:0!important;color:var(--text);
      font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
      overflow:hidden;
    }
    .wash{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .wash iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
    .wash-light{opacity:0}
    .wash-dark{opacity:1}
    @media (prefers-color-scheme: light){html:not(.dark) .wash-light{opacity:1} html:not(.dark) .wash-dark{opacity:0}}
    html.light .wash-light{opacity:1} html.light .wash-dark{opacity:0}
    html.dark .wash-light{opacity:0} html.dark .wash-dark{opacity:1}
    ::selection{background:color-mix(in srgb,var(--accent) 38%, transparent);color:inherit}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    .ui-icon{display:block;width:18px;height:18px;flex:none;background-color:currentColor;-webkit-mask:var(--ui-icon) center/contain no-repeat;mask:var(--ui-icon) center/contain no-repeat}
    .ui-icon.is-bitmap{background-color:transparent;background-image:var(--ui-icon);background-size:contain;background-repeat:no-repeat;background-position:center;-webkit-mask:none;mask:none}
    .seg button .ui-icon,.send-dot .ui-icon,.sheet-ico .ui-icon{width:16px;height:16px}
    .editor h1,.editor h2,.editor h3,.editor h4,.editor h5,.editor h6,.preview h1,.preview h2,.preview h3,.preview h4,.preview h5,.preview h6{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.03em;line-height:1.2;font-weight:650}
    .editor h1,.preview h1{font-size:28px;font-weight:750;margin:0 0 .45em}
    .editor h2,.preview h2{font-size:24px;margin:.95em 0 .4em}
    .editor h3,.preview h3{font-size:20px;margin:.9em 0 .35em}
    .editor h4,.preview h4{font-size:18px;margin:.85em 0 .3em}
    .editor h5,.preview h5{font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin:.85em 0 .3em}
    .editor h6,.preview h6{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:.85em 0 .3em}
    .editor .tg-footer,.preview .tg-footer,.editor footer{display:block;font-size:12px;color:var(--muted);margin:1.6em 0 .4em;padding-top:.7em;border-top:1px solid color-mix(in srgb,var(--text) 14%, transparent);font-weight:400}
    .menu-list button.is-current{background:color-mix(in srgb,var(--accent) 16%, transparent);color:var(--accent)}
    .heading-list .h-opt.h1{font-size:20px;font-weight:750;letter-spacing:-.03em}
    .heading-list .h-opt.h2{font-size:17px;font-weight:650}
    .heading-list .h-opt.h3{font-size:15px;font-weight:650}
    .heading-list .h-opt.h4{font-size:14px;font-weight:650}
    .heading-list .h-opt.h5{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase}
    .heading-list .h-opt.h6{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .heading-list .h-opt.footer{font-size:12px;color:var(--muted)}
    .heading-list .sheet-btn.is-current,.heading-list button.is-current{color:var(--accent)}
    .frost{
      position:relative;
      background:var(--glass);
      border:0;
      box-shadow:var(--glass-shadow);
      backdrop-filter:url(#frosted);
      -webkit-backdrop-filter:blur(20px) saturate(var(--glass-saturation,1.15));
    }
    .glass-surface__filter{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
    .app{
      position:relative;z-index:1;
      width:100%;height:100%;min-height:100lvh;max-width:none;margin:0;padding:0;
      display:flex;flex-direction:column;
      overflow:hidden;background:transparent;
    }
    .chrome-top{position:absolute;top:0;left:0;right:0;z-index:12;padding:var(--tg-top) 0 8px;pointer-events:none}
    .chrome-top .topbar,.chrome-top .meta{pointer-events:auto}
    .chrome-fog{position:absolute;left:0;right:0;pointer-events:none;backdrop-filter:blur(16px) saturate(1.18);-webkit-backdrop-filter:blur(16px) saturate(1.18)}
    .chrome-fog-top{top:0;height:calc(100% + 28px);opacity:var(--top-blur,0);mask-image:linear-gradient(to bottom,#000 0%,#000 58%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 58%,transparent 100%)}
    .chrome-fog-bottom{bottom:0;height:calc(100% + 32px);mask-image:linear-gradient(to top,#000 0%,#000 48%,transparent 100%);-webkit-mask-image:linear-gradient(to top,#000 0%,#000 48%,transparent 100%)}
    .topbar{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;margin:8px 12px 0;padding:4px 12px;min-height:36px}
    .brand{font-weight:700;font-size:15px;letter-spacing:.08em;text-align:center;border:0;background:transparent;color:inherit;padding:8px 12px;margin:0;border-radius:999px;font-family:inherit;appearance:none;-webkit-appearance:none}
    .field-label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px}
    .link-input{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;padding:0 12px}
    .link-form{display:flex;gap:8px;align-items:center}
    .link-go{height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:transparent}
    .connect-hero{display:grid;place-items:center;margin:4px 0 8px}
    .connect-hero img{width:64px;height:64px;border-radius:16px;object-fit:cover;background:#000}
    .iconbtn{
      width:36px;height:36px;border:0;border-radius:999px;padding:0;
      background:transparent;display:grid;place-items:center;color:inherit
    }
    .iconbtn svg,.bar svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .meta{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 16px 0}
    .title{display:none}
    .stats{display:none}
    .meta .seg:last-child{margin-left:auto}
    .seg{display:flex;align-items:center;gap:4px;padding:4px;height:44px;border-radius:999px}
    .seg button{
      width:36px;height:36px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center
    }
    .seg button.active{background:color-mix(in srgb,var(--text) 12%, transparent)}
    .seg button.is-flash{position:relative}
    .seg button.is-flash::before{content:"";position:absolute;inset:0;width:36px;height:36px;margin:auto;border-radius:50%;background:color-mix(in srgb,var(--text) 14%, transparent);z-index:0;animation:flash-out 1.4s ease forwards}
    html.light .seg button.is-flash::before{background:color-mix(in srgb,var(--text) 12%, #fff)}
    .seg button.is-flash > *{position:relative;z-index:1}
    @keyframes flash-out{0%,35%{opacity:1}100%{opacity:0}}
    .bar > button{position:relative}
    .bar > button.on{background:transparent;color:inherit}
    .bar > button.on::before{content:"";position:absolute;inset:0;width:36px;height:36px;margin:auto;border-radius:50%;background:color-mix(in srgb,var(--text) 14%, transparent);z-index:0}
    html.light .bar > button.on::before{background:color-mix(in srgb,var(--text) 12%, #fff)}
    .bar > button > *{position:relative;z-index:1}
    .seg svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .canvas{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--tg-top) + 108px) 16px calc(var(--bar-h) + var(--kb) + var(--safe-bottom) + 28px);position:relative}
    .editor,.preview{
      outline:none;min-height:100%;caret-color:var(--accent);
      -webkit-user-select:text;user-select:text
    }
    .preview{display:none}
    .preview.on{display:block}
    .editor.off{display:none}
    .editor p,.preview p{margin:.7em 0}
    .editor blockquote,.preview blockquote{margin:1em 0;padding:0 0 0 12px;border-left:3px solid var(--accent)}
    .editor ul,.preview ul{padding-left:1.2em}
    .editor table{width:100%;border-collapse:collapse;font-size:14px}
    .editor th,.editor td{border:1px solid var(--line);padding:6px}
    .editor a{color:var(--accent)}
    .block-card{margin:12px 0;padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:14px}
    .block-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
    .bar-wrap{
      position:fixed;left:0;right:0;bottom:var(--kb);z-index:20;
      padding:8px 12px calc(var(--safe-bottom) + 8px);
      background:transparent;
    }
    .bar{
      position:relative;z-index:1;max-width:none;margin:0;
      display:flex;align-items:center;
      min-height:48px;padding:4px;border-radius:999px;
    }
    .bar > button{
      flex:1;min-width:0;height:40px;border:0;background:transparent;color:inherit;
      display:grid;place-items:center;border-radius:999px;padding:0
    }
    .bar .plus,.bar .send{flex:0 0 40px}
    .send-dot{
      width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
      background:color-mix(in srgb,var(--accent) 78%, transparent);color:#fff;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 4px 14px color-mix(in oklab,var(--accent) 45%,transparent)
    }
    .send-dot svg{width:16px;height:16px}
    .seg .send{width:36px;height:36px;border:0;background:transparent;display:grid;place-items:center;padding:0;border-radius:50%}
    .seg .send-dot{width:36px;height:36px}
    .backdrop{position:fixed;inset:0;z-index:30;display:none;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
    .backdrop.on{display:block}
    .sheet{
      position:fixed;left:var(--sheet-left,14px);right:auto;bottom:calc(var(--bar-h) + var(--kb) + var(--safe-bottom) + 12px);
      z-index:40;width:max-content;max-width:calc(100vw - 28px);
      max-height:calc(var(--vv-h, 100dvh) - var(--bar-h) - 24px);
      overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;
      display:none;padding:8px;border:1px solid color-mix(in srgb,var(--text) 12%,transparent);border-radius:30px;
      color:var(--text);background:color-mix(in srgb,var(--bg) 92%,transparent);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 14px rgba(0,0,0,.18),0 22px 48px rgba(0,0,0,.28);
      -webkit-backdrop-filter:none;backdrop-filter:none;
      transform-origin:var(--sheet-origin,50%) 100%;animation:sheet-in .16s cubic-bezier(.2,.75,.25,1)
    }
    .sheet.is-top{
      bottom:auto;top:var(--sheet-top,72px);
      max-height:calc(var(--vv-h, 100dvh) - var(--sheet-top, 72px) - var(--kb) - 16px);
      transform-origin:var(--sheet-origin,50%) 0;
    }
    @keyframes sheet-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
    .menu-list{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:auto}
    .menu-list button{display:flex;align-items:center;justify-content:flex-start;text-align:left;width:auto;min-width:100%;white-space:nowrap;min-height:clamp(44px, calc((var(--vv-h) - var(--bar-h) - 32px) / 10), 58px);border-radius:20px;border:0;background:transparent;box-shadow:none;padding:4px 18px 4px 6px;font-size:17px;gap:12px}
    .menu-list button:hover{background:color-mix(in srgb,var(--text) 7%,transparent)}
    .menu-list button:active{background:color-mix(in srgb,var(--text) 12%,transparent)}
    .sheet-ico{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--text) 11%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
    .sheet-ico .ui-icon,.sheet-ico svg{width:20px;height:20px}
    .sheet.on{display:block}
    .sheet.frost{-webkit-backdrop-filter:none;backdrop-filter:none}
    .sheet h3{margin:6px 8px 10px;font-size:17px}
    .sheet p,.hint{margin:0 8px 12px;font-size:13px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
    .grid button,.stack button{
      min-height:52px;border-radius:18px;border:0;
      background:color-mix(in srgb,var(--text) 8%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
      display:flex;align-items:center;gap:8px;
      padding:0 14px;font-size:15px;text-align:left
    }
    .grid button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .stack{display:flex;flex-direction:column;gap:6px}
    .stack button{justify-content:space-between}
    .toast{
      position:fixed;left:50%;bottom:calc(var(--bar-h) + var(--kb) + 16px);
      transform:translateX(-50%);z-index:50;display:none;
      padding:8px 12px;border-radius:999px;font-size:12px
    }
    .toast.on{display:block}
    .payload{max-height:22vh;overflow:auto;font:11px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
    @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.sheet{background:var(--bg)}.backdrop{background:transparent}}
    @media (prefers-reduced-motion:reduce){.sheet{animation:none}}
  </style>
</head>
<body>
  <div class="wash" aria-hidden="true">
    <iframe class="wash-light" src="backgrounds/light.html" title="" tabindex="-1" loading="eager"></iframe>
    <iframe class="wash-dark" src="backgrounds/dark.html" title="" tabindex="-1" loading="eager"></iframe>
  </div>
  <svg class="glass-surface__filter" aria-hidden="true">
    <filter id="frosted" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB" x="0" y="0" width="1" height="1">
      <feImage href="glass-map.png" x="0" y="0" width="1" height="1" result="map" preserveAspectRatio="none"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.02" result="blur"/>
      <feDisplacementMap in="blur" in2="map" scale="0.12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div class="app">
    <div class="chrome-top">
      <div class="chrome-fog chrome-fog-top" aria-hidden="true"></div>
      <header class="topbar">
        <button type="button" class="brand" id="brandBtn">MDTXTRT</button>
      </header>
      <div class="meta">
      <div class="seg frost">
        <button type="button" id="undoBtn" aria-label="Desfazer"><span class="ui-icon" data-icon="undo"></span></button>
        <button type="button" id="redoBtn" aria-label="Refazer"><span class="ui-icon" data-icon="redo"></span></button>
      </div>
      <input id="docName" class="title" value="Ideia" aria-label="Nome">
      <div class="seg frost">
        <button id="editTab" class="active" aria-label="Editar"><span class="ui-icon" data-icon="edit"></span></button>
        <button class="send" id="publishBtn" aria-label="Publicar"><span class="send-dot"><span class="ui-icon" data-icon="send"></span></span></button>
      </div>
    </div>
    </div>
    <div class="canvas" id="canvas">
      <article id="editor" class="editor" contenteditable="true" spellcheck="true" inputmode="text" enterkeyhint="enter" aria-label="Editor">
        <h1>MDTXTRT</h1>
        <p>Editor para <strong>Telegram</strong> e <strong>Telegraph</strong>.</p>
        <h2>Escrever uma vez</h2>
        <p>TXT e Markdown entram e saem. A publicação vai para Telegram (Bot API 10.3) ou Telegraph.</p>
        <blockquote>Uma edição, dois destinos.</blockquote>
        <ul>
          <li>Títulos, listas, links e citação</li>
          <li>Tabela compacta e citação expansível</li>
          <li>Documento via tg://document</li>
        </ul>
      </article>
      <article id="preview" class="preview" aria-label="Prévia"></article>
    </div>
  </div>
  <div class="bar-wrap">
    <div class="chrome-fog chrome-fog-bottom" aria-hidden="true"></div>
    <div class="bar frost" id="typebar">
      <button class="plus" id="plusBtn" aria-label="Mais"><span class="ui-icon" data-icon="plus"></span></button>
      <button type="button" data-cmd="bold" aria-label="Negrito"><span class="ui-icon" data-icon="bold"></span></button>
      <button type="button" data-cmd="italic" aria-label="Itálico"><span class="ui-icon" data-icon="italic"></span></button>
      <button type="button" data-cmd="underline" aria-label="Sublinhado"><span class="ui-icon" data-icon="underline"></span></button>
      <button type="button" id="quoteBtn" aria-label="Citação"><span class="ui-icon" data-icon="quote"></span></button>
      <button type="button" id="linkBtn" aria-label="Link"><span class="ui-icon" data-icon="link"></span></button>
      <button type="button" id="headingBtn" aria-label="Título"><span class="ui-icon" data-icon="heading"></span></button>
      <button type="button" data-cmd="insertUnorderedList" aria-label="Lista"><span class="ui-icon" data-icon="list"></span></button>
    </div>
  </div>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet frost" id="headingMenu">
    <div class="menu-list heading-list">
      <button class="h-opt h1" data-block="h1"><span class="sheet-ico"><span class="ui-icon" data-icon="h1"></span></span>Título H1</button>
      <button class="h-opt h2" data-block="h2"><span class="sheet-ico"><span class="ui-icon" data-icon="h2"></span></span>Título H2</button>
      <button class="h-opt h3" data-block="h3"><span class="sheet-ico"><span class="ui-icon" data-icon="h3"></span></span>Título H3</button>
      <button class="h-opt h4" data-block="h4"><span class="sheet-ico"><span class="ui-icon" data-icon="h4"></span></span>Título H4</button>
      <button class="h-opt h5" data-block="h5"><span class="sheet-ico"><span class="ui-icon" data-icon="h5"></span></span>Título H5</button>
      <button class="h-opt h6" data-block="h6"><span class="sheet-ico"><span class="ui-icon" data-icon="h6"></span></span>Título H6</button>
      <button data-block="p"><span class="sheet-ico"><span class="ui-icon" data-icon="paragraph"></span></span>Corpo</button>
      <button class="h-opt footer" data-block="footer"><span class="sheet-ico"><span class="ui-icon" data-icon="footer"></span></span>Rodapé Telegram</button>
    </div>
  </div>
  <div class="sheet frost" id="quoteMenu">
    <div class="menu-list">
      <button data-block="blockquote"><span class="sheet-ico"><span class="ui-icon" data-icon="quote"></span></span>Citação</button>
      <button data-insert="expandquote"><span class="sheet-ico"><span class="ui-icon" data-icon="more"></span></span>Citação 10.3</button>
    </div>
  </div>
  <div class="sheet frost" id="importMenu">
    <div class="menu-list">
      <button id="importMdBtn"><span class="sheet-ico"><span class="ui-icon" data-icon="import"></span></span>Importar Markdown</button>
      <button id="importTxtBtn"><span class="sheet-ico"><span class="ui-icon" data-icon="import"></span></span>Importar TXT</button>
    </div>
  </div>
  <div class="sheet frost" id="plusMenu">
    <div class="menu-list">
      <button data-insert="task"><span class="sheet-ico"><span class="ui-icon" data-icon="task"></span></span>Tarefa</button>
      <button data-insert="table"><span class="sheet-ico"><span class="ui-icon" data-icon="table"></span></span>Tabela</button>
      <button data-insert="details"><span class="sheet-ico"><span class="ui-icon" data-icon="details"></span></span>Details</button>
      <button data-insert="document"><span class="sheet-ico"><span class="ui-icon" data-icon="document"></span></span>Documento</button>
      <button data-insert="button"><span class="sheet-ico"><span class="ui-icon" data-icon="buttons"></span></span>Botões</button>
    </div>
  </div>
  <div class="sheet frost" id="publishSheet">
    <div class="menu-list">
      <button id="telegramPublishBtn"><span class="sheet-ico"><span class="ui-icon" data-icon="send"></span></span>Telegram</button>
      <button id="telegraphPublishBtn"><span class="sheet-ico"><span class="ui-icon" data-icon="open"></span></span>Telegraph</button>
      <button id="exportTxtBtn"><span class="sheet-ico"><span class="ui-icon" data-icon="file"></span></span>Exportar TXT</button>
      <button id="exportMdBtn"><span class="sheet-ico"><span class="ui-icon" data-icon="document"></span></span>Exportar Markdown</button>
    </div>
    <pre class="payload" id="payloadBox" hidden></pre>
  </div>
  <input id="fileInput" type="file" accept=".txt,.md,text/plain,text/markdown" hidden>
  <div class="toast frost" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
