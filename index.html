<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MDTXTRT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#121212);--fg:var(--tg-theme-text-color,#e0e0e0);--hint:var(--tg-theme-hint-color,#888);--btn:var(--tg-theme-button-color,#2481cc);--btnt:var(--tg-theme-button-text-color,#fff);--sec:var(--tg-theme-secondary-bg-color,#1e1e1e)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--sec);border-bottom:1px solid rgba(255,255,255,.06)}
header h1{font-size:15px;margin:0;flex:0 0 auto}
.grow{flex:1}
button{border:0;border-radius:8px;padding:8px 10px;background:transparent;color:var(--hint);cursor:pointer}
button.primary{background:var(--btn);color:var(--btnt);font-weight:600;font-size:12px}
.meta{padding:8px 12px;background:var(--sec);border-bottom:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:6px}
.meta input{background:transparent;border:0;color:var(--fg);outline:none;font:inherit}
.meta input[type=text]:last-child{color:var(--hint);font-size:12px}
.tools{display:flex;gap:4px;overflow:auto;padding:6px 10px;background:var(--sec)}
.tools button{padding:6px 8px;font-size:12px}
main{flex:1;position:relative;min-height:0}
textarea,#preview{position:absolute;inset:0;width:100%;height:100%;padding:16px;border:0;resize:none;background:transparent;color:var(--fg);font:17px/1.55 inherit;outline:none}
#preview{overflow:auto;display:none}
#preview h1{font-size:1.8em}#preview h2{font-size:1.4em}#preview pre{background:var(--sec);padding:12px;border-radius:8px;overflow:auto}
#preview code{background:rgba(255,255,255,.08);padding:1px 4px;border-radius:4px}
#preview blockquote{border-left:3px solid var(--hint);margin-left:0;padding-left:12px;color:var(--hint)}
#preview a{color:var(--btn)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:8px 14px;border-radius:16px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>MDTXTRT</h1>
  <div class="grow"></div>
  <button id="toggleBtn" type="button">Preview</button>
  <button id="copyBtn" type="button">Copiar</button>
  <button id="publishBtn" class="primary" type="button">Publicar</button>
</header>
<div class="meta">
  <input id="fileTitle" type="text" placeholder="Título do documento">
  <input id="telegraphPath" type="text" placeholder="Slug opcional (ex: meu-artigo)">
</div>
<div class="tools" id="tools">
  <button type="button" data-wrap="**,**">B</button>
  <button type="button" data-wrap="_,_">I</button>
  <button type="button" data-wrap="~~,~~">S</button>
  <button type="button" data-wrap="||,||">||</button>
  <button type="button" data-line="# ">H1</button>
  <button type="button" data-line="## ">H2</button>
  <button type="button" data-line="- ">•</button>
  <button type="button" data-line="1. ">1.</button>
  <button type="button" data-wrap="`,`">&lt;/&gt;</button>
  <button type="button" data-wrap="```\n,\n```">code</button>
  <button type="button" data-wrap="[,](url)">link</button>
</div>
<main>
  <textarea id="markdownInput" placeholder="Escreva em Markdown."></textarea>
  <div id="preview"></div>
</main>
<div id="toast" class="toast"></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : {};
if (tg.ready) tg.ready();
if (tg.expand) tg.expand();
if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
if (window.marked) marked.setOptions({breaks:true,gfm:true});
const input = document.getElementById('markdownInput');
const preview = document.getElementById('preview');
const titleInput = document.getElementById('fileTitle');
const pathInput = document.getElementById('telegraphPath');
const toastEl = document.getElementById('toast');
let isPreview = false;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('on');setTimeout(()=>toastEl.classList.remove('on'),2200)}
function wrap(a,b){const s=input.selectionStart,e=input.selectionEnd,t=input.value,sel=t.slice(s,e);input.value=t.slice(0,s)+a+sel+b+t.slice(e);input.focus();input.selectionStart=input.selectionEnd=s+a.length+(sel?sel.length+b.length:0);save();updateBtn()}
function line(tag){const s=input.selectionStart,t=input.value;let i=t.lastIndexOf('\n',s-1);i=i<0?0:i+1;input.value=t.slice(0,i)+tag+t.slice(i);input.focus();input.selectionStart=input.selectionEnd=s+tag.length;save();updateBtn()}
document.getElementById('tools').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  if(b.dataset.wrap){const parts=b.dataset.wrap.split(','); const a=parts[0].replace(/\\n/g,'\n'); const c=(parts[1]||'').replace(/\\n/g,'\n'); wrap(a,c);}
  if(b.dataset.line) line(b.dataset.line);
});
function save(){try{localStorage.setItem('mdtxtrt_draft',input.value);localStorage.setItem('mdtxtrt_title',titleInput.value);localStorage.setItem('mdtxtrt_path',pathInput.value);}catch(e){}}
function payload(action){return{action,type:action==='publish_telegraph'?'telegraph':'markdown',title:(titleInput.value||'').trim()||'Sem título',path:(pathInput.value||'').trim(),content:input.value,timestamp:Date.now()}}
function updateBtn(){if(!tg.MainButton)return; if(input.value.trim()){tg.MainButton.setText('Enviar para o Bot');tg.MainButton.show();tg.MainButton.enable()} else tg.MainButton.hide()}
function sendToBot(){if(!input.value.trim())return;save();if(!tg.sendData){toast('Abra pelo Telegram');return} const raw=JSON.stringify(payload('markdown')); if(raw.length>4000){toast('Texto grande — use Publicar');return} tg.sendData(raw); if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success')}
async function publishTelegraph(){if(!input.value.trim()){toast('Documento vazio');return} save();
  try{const res=await fetch('/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload('publish_telegraph'))}); const data=await res.json(); if(!data.ok) throw new Error(data.error||'Falha'); toast('Publicado'); if(data.url){try{await navigator.clipboard.writeText(data.url)}catch(e){} if(tg.openLink) tg.openLink(data.url); else window.open(data.url,'_blank')}}
  catch(err){toast(err.message||'Erro ao publicar')}}
document.getElementById('toggleBtn').onclick=()=>{isPreview=!isPreview; if(isPreview){preview.innerHTML=input.value.trim()?(window.marked?marked.parse(input.value.replace(/\|\|(.*?)\|\|/g,'$1')):input.value.replace(/\n/g,'<br>')):'<em style="color:var(--hint)">Vazio</em>'; preview.style.display='block'; input.style.display='none'; document.getElementById('toggleBtn').textContent='Editar'} else {preview.style.display='none'; input.style.display='block'; document.getElementById('toggleBtn').textContent='Preview'; input.focus()}}
document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(input.value);toast('Copiado')}catch(e){toast('Falha ao copiar')}}
document.getElementById('publishBtn').onclick=publishTelegraph;
input.addEventListener('input',()=>{updateBtn();save()});
titleInput.addEventListener('input',save); pathInput.addEventListener('input',save);
try{input.value=localStorage.getItem('mdtxtrt_draft')||localStorage.getItem('tg-markdown-editor')||''; titleInput.value=localStorage.getItem('mdtxtrt_title')||''; pathInput.value=localStorage.getItem('mdtxtrt_path')||''}catch(e){}
if(tg.MainButton) tg.MainButton.onClick(sendToBot);
if(tg.BackButton){tg.BackButton.show(); tg.BackButton.onClick(()=>{if(input.value.trim()&&!confirm('Sair sem enviar?'))return; tg.close()})}
updateBtn(); setInterval(save,300000);
</script>
</body>
</html>
