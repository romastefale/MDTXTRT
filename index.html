  <style>
    :root{
      /* Material Liquid Glass do site romastefale/HTML (mesmo de produto/index.html):
         fundo orgânico multicor que nasce e termina na cor da borda (--edge), vidro
         neutro translúcido com desfoque e aro hairline. */
      --edge:#1b1646;
      --bg-art:url("produto/fundo-escuro.svg");
      --bg:#211d52;
      --text:#f5f5f7;
      --dim:#d1d1d6;
      /* Normativa do fork romastefale/liquid-glass e do site romastefale/HTML:
         tintas sempre translúcidas (tint-control nas barras, tint-frost nos painéis,
         tint-soft nos botões em destaque), frost do material (6px, saturate 1.15)
         nas barras e de painel (22px, 1.4) em menus e diálogos, brightness 0, brilho
         especular de topo (.55 × specular) e um único aro hairline uniforme. */
      --glass:rgba(44,40,80,.55);
      --glass-panel:rgba(28,24,60,.5);
      --glass-strong:rgba(255,255,255,.12);
      --glass-press:rgba(255,255,255,.14);
      --rim:rgba(255,255,255,.14);
      --rim-w:1px;
      --specular:rgba(255,255,255,.55);
      --float:0 10px 28px rgba(30,20,90,.16),0 2px 6px rgba(30,20,90,.08);
      --blur:blur(6px) saturate(1.15);
      --blur-panel:blur(22px) saturate(1.4);
      --glass-ease:cubic-bezier(.34,1.36,.42,1);
      --glass-edge:0 0 0 var(--rim-w) var(--rim),inset 0 var(--rim-w) 0 var(--specular);
      --pill-gap:6px;
      /* Acento do editor: cor de link do Telegram no tema escuro, legível no fundo roxo. */
      --accent:#6ab3f3;
      /* Cor de link do texto do editor: a do tema do Telegram quando o SDK a injeta. */
      --link:var(--tg-theme-link-color,#6ab3f3);
      /* Neutros puros (alfa do texto), sem mistura com acento, nos dois temas. */
      --muted:color-mix(in srgb,var(--text) 66%,transparent);
      --neutral-1:color-mix(in srgb,var(--text) 5%,transparent);
      --neutral-2:color-mix(in srgb,var(--text) 8%,transparent);
      --neutral-3:color-mix(in srgb,var(--text) 12%,transparent);
      --neutral-4:color-mix(in srgb,var(--text) 18%,transparent);
      --line:color-mix(in srgb,var(--text) 18%,transparent);
      --glass-tint:var(--glass);
      --glass-tint-strong:var(--glass-strong);
      --bar-glass-tint-strong:var(--glass-strong);
      --bar-control-accent-bg:transparent;
      --menu-edge:var(--rim);
      --glass-field:rgba(255,255,255,.12);
      --glass-field-soft:rgba(255,255,255,.08);
      --library-surface:color-mix(in srgb,var(--text) 6%,transparent);
      --library-section-bg:color-mix(in srgb,var(--text) 9%,transparent);
      --library-card-bg:color-mix(in srgb,var(--text) 12%,transparent);
      --library-card-border:var(--line);
      --library-backdrop:rgba(0,0,0,.62);
      --library-shadow:rgba(0,0,0,.48);
      --menu-shadow:rgba(8,4,40,.34);
      --menu-shadow-tight:rgba(8,4,40,.18);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --safe-right:env(safe-area-inset-right,0px);
      --safe-bottom-max:env(safe-area-max-inset-bottom,36px);
      --gap:var(--pill-gap);
      --bar-side-inset:20px;
      --bar-bottom-inset:32px;
      /* Oito botões da barra inferior + sete vãos iguais cabem na largura útil. */
      --control-size:clamp(32px,calc((100vw - 2*var(--bar-side-inset) - 2*var(--pill-pad) - 7*var(--pill-gap))/8),40px);
      --pill-pad:var(--pill-gap);
      --pill-h:calc(var(--control-size) + var(--pill-pad)*2);
      --editor-top-gap:8px;
      --topbar-h:var(--pill-h);
      --bar-h:var(--pill-h);
      --menu-w:210px;
      --menu-row-h:24px;
      --menu-radius:9px;
      --vv-top:0px;
      --vv-bottom:0px;
      --vv-height:100dvh;
      --menu-cap:min(55dvh,420px);
      --bottom:var(--safe-bottom);
      --head-inset:calc(var(--safe-top) + var(--gap) + var(--topbar-h) + var(--editor-top-gap) + var(--gap));
      --foot-inset:calc(var(--bottom) + var(--bar-bottom-inset) + var(--bar-h) + var(--gap));
    }
    html.tg-shell{
      --safe-top:var(--app-tg-content-safe-top);

      --safe-right:var(--app-tg-content-safe-right);

      --menu-shadow:rgba(30,20,90,.16);
      --menu-shadow-tight:rgba(30,20,90,.08);
    }

    .seg button .ui-icon,.action-dot .ui-icon,.sheet-ico .ui-icon{width:16px;height:16px}
    .editor h1,.editor h2,.editor h3,.editor h4,.editor h5,.editor h6{font-family:inherit;letter-spacing:-.03em;line-height:1.2;font-weight:650}
    .editor h1{font-size:28px;font-weight:750;margin:0 0 .45em}

    .heading-list .h-opt.h4{font-size:14px;font-weight:650}
    .heading-list .h-opt.h5{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase}

    /* Aro hairline por fora da borda (lê contra a página nos dois temas), brilho
       especular fino no topo e a sombra flutuante suave do site. */
    .seg,.bar,.toast-material{
      background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
      box-shadow:var(--glass-edge),var(--float)
    }
    .glass-menu-material{

      box-shadow:var(--glass-edge),var(--float)
    }
    /* Estados: pressão com escala sutil na mola do fork (glassEase), hover com brilho. */
    .seg button,.bar > button,.theme-switch{transition:transform .22s var(--glass-ease),filter .16s ease}
    .seg button:active,.bar > button:active,.theme-switch:active{transform:scale(.975)}
    @media (hover:hover){.seg button:hover,.bar > button:hover,.theme-switch:hover{filter:brightness(1.08)}}
    .seg,.bar{color:var(--text);border-radius:999px}

    }

    }
    .app{display:contents}

      position:fixed;z-index:30;

    }

    .bar{
      position:relative;z-index:1;width:max-content;max-width:100%;margin:0 auto;
      display:flex;align-items:center;justify-content:space-between;gap:var(--pill-gap);overflow-x:auto;overscroll-behavior-inline:contain;
      height:var(--bar-h);padding:var(--pill-pad);border-radius:999px;pointer-events:auto
    }
    .bar > button{
      flex:0 0 var(--control-size);width:var(--control-size);min-width:var(--control-size);height:var(--control-size);
      border:0;background:transparent;color:inherit;display:grid;place-items:center;border-radius:999px;padding:0
    }
    /* + e ☰ continuam em destaque, agora como vidro mais denso em vez de acento sólido. */
    .bar > button.more{background:var(--glass-strong);box-shadow:var(--glass-edge)}
    .bar > button.more.on::before{display:none}
    .action-dot{
      width:var(--control-size);height:var(--control-size);border-radius:50%;display:grid;place-items:center;
      position:relative;background:var(--glass-strong);color:inherit;box-shadow:var(--glass-edge)
    }
    /* Lente WebGL 2 (fork, <Glass draw>) dentro do + e do ☰: fica sob o ícone, não
       recebe ponteiro nem foco. Sem WebGL 2 o elemento some e fica o vidro em CSS. */
    .lens{position:absolute;inset:0;z-index:0;border-radius:inherit;overflow:hidden;pointer-events:none;color:transparent;font-size:0}
    .lens canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .lens::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--glass-strong);box-shadow:inset 0 var(--rim-w) 0 var(--specular)}
    .lens:not([data-live]):not([data-frozen]){display:none}
    .action-dot > .ui-icon{position:relative;z-index:1}
    .bar > button > .lens{position:absolute;z-index:0}
    .seg .export{
      width:var(--control-size);height:var(--control-size);border:0;background:transparent;
      display:grid;place-items:center;padding:0;border-radius:50%
    }
    .seg .action-dot{width:var(--control-size);height:var(--control-size)}
    .glass-menu{
      position:fixed;left:50%;top:50%;right:auto;bottom:auto;z-index:40;margin:0;
      width:min(var(--menu-w),var(--menu-max-width,calc(100vw - 16px)));height:max-content;
      max-height:var(--menu-max-height,var(--menu-cap));overflow:visible;padding:0;border:0;
      border-radius:var(--menu-radius);background:transparent;color:var(--text);
      transform:translate(-50%,-50%)
    }
    .glass-menu[data-anchor],.glass-menu[data-runtime-positioned]{left:var(--menu-left,50%);top:var(--menu-top,50%);transform:none}
    .glass-menu.wide-menu{width:min(var(--menu-w),var(--menu-max-width,calc(100vw - 16px)))}
    .glass-menu.dialog-menu,.glass-menu.find-menu{width:min(280px,var(--menu-max-width,calc(100vw - 16px)))}
    .menu-dismiss-layer{
      position:fixed;inset:0;z-index:39;background:transparent;pointer-events:auto;touch-action:none
    }
    .menu-dismiss-layer[hidden]{display:none}
    .glass-menu:not([data-menu-open]):not([popover]){display:none}
    .glass-menu[popover]:not(:popover-open){display:none}
    .glass-menu[data-menu-open],.glass-menu[popover]:popover-open{
      display:block;animation:glass-menu-in .14s cubic-bezier(.2,.75,.25,1)
    }
    #dialogMenu:popover-open::backdrop{background:transparent;pointer-events:auto}
    @keyframes glass-menu-in{from{opacity:0}to{opacity:1}}
    .glass-menu-material{border-radius:var(--menu-radius)}
    .glass-menu-content{
      position:relative;z-index:1;display:flex;flex-direction:column;max-height:var(--menu-max-height,var(--menu-cap));overflow:hidden;
      border-radius:var(--menu-radius);padding:5px 6px
    }
    .menu-list{
      display:flex;flex:1 1 auto;flex-direction:column;gap:0;min-height:0;max-height:none;
      overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y
    }
    .menu-list > button{
      display:flex;align-items:center;justify-content:flex-start;text-align:left;
      width:100%;min-width:0;white-space:nowrap;height:var(--menu-row-h);min-height:var(--menu-row-h);
      border-radius:6px;border:0;background:transparent;box-shadow:none;
      padding:0 11px;font-size:13px;line-height:1;gap:8px;color:inherit
    }
    .menu-list > button[hidden]{display:none}
    .menu-list > button:hover,.menu-list > button:focus-visible{background:var(--glass-strong)}
    .menu-list > button:active{background:var(--glass-press)}
    .menu-divider{height:11px;min-height:11px;position:relative}
    .menu-divider::after{content:"";position:absolute;left:8px;right:8px;top:5px;height:1px;background:var(--menu-edge)}
    .sheet-ico{width:16px;height:16px;border-radius:4px;flex:none;display:grid;place-items:center;background:transparent;box-shadow:none}
    .sheet-ico .ui-icon,.sheet-ico svg{width:13px;height:13px}
    .menu-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
    .menu-chevron{width:13px;height:13px;flex:none;display:grid;place-items:center;margin-left:auto;opacity:.55}
    .menu-chevron .ui-icon{width:12px;height:12px}
    .menu-list > button:hover .menu-chevron,.menu-list > button:focus-visible .menu-chevron{opacity:1}
    .plus-submenu .submenu-back{font-weight:650}
    .glass-menu .heading-list .h-opt{font-size:13px;font-weight:500;letter-spacing:0;text-transform:none}
    .toast{
      position:fixed;left:50%;bottom:calc(var(--vv-bottom) + var(--foot-inset) + 8px);
      transform:translateX(-50%);z-index:50;display:none;min-width:80px;max-width:min(86vw,420px);
      padding:0;border-radius:999px;font-size:12px;line-height:1.25;color:var(--text);pointer-events:none
    }
    .toast.on{display:block}
    .toast-material{
      border-radius:999px;overflow:hidden
    }
    .toast-content{
      position:relative;z-index:1;display:block;padding:8px 13px;
      color:inherit;text-align:center;white-space:normal
    }
    .tools{display:flex;gap:6px;align-items:center;padding:4px;max-width:100%}
    .document-tools{padding:5px 6px 3px;flex-direction:column;align-items:stretch;gap:3px}
    .document-tools::before{content:attr(data-field-label);display:block;padding:0 3px;color:var(--muted);font-size:11px;line-height:1.25}
    .hint{max-width:240px;white-space:normal;margin:5px 8px 7px;font-size:12px;line-height:1.35}
    .tools input{
      min-width:0;width:100%;height:32px;border:0;border-radius:7px;
      background:var(--glass-field);color:inherit;padding:0 9px;outline:0;font-size:13px
    }
    .tools button{
      min-height:30px;border:0;border-radius:6px;background:var(--glass-strong);box-shadow:var(--glass-edge);
      padding:0 9px;color:inherit;font-size:12px
    }
    .library-menu-list{gap:0}
    .library-status{
      min-height:18px;padding:3px 11px 6px;color:var(--muted);
      font-size:10.5px;line-height:1.3;font-weight:560
    }
    .library-section-toggle .library-section-count{margin-left:auto}
    .library-section-toggle[aria-expanded="true"] .menu-chevron{transform:rotate(90deg)}
    .library-section-toggle .menu-chevron{transition:transform .16s ease}
    .library-section-count{
      min-width:21px;height:21px;border-radius:999px;display:inline-grid;place-items:center;padding:0 7px;
      background:var(--glass-field-soft);color:var(--muted);font-size:10px;font-weight:750;line-height:1
    }
    .menu-list > button:hover .library-section-count,
    .menu-list > button:focus-visible .library-section-count{background:var(--glass-field)}
    .library-publication-groups,.library-draft-groups{
      display:flex;flex-direction:column;gap:9px;min-width:0;padding:5px 0 3px
    }
    .library-publication-groups[hidden],.library-draft-groups[hidden]{display:none}
    .library-platform-group{display:flex;flex-direction:column;gap:5px;min-width:0}
    .library-platform-group>h3,.library-section-heading h3{
      margin:0;color:var(--muted);font-size:10px;line-height:1.3;font-weight:700;
      text-transform:uppercase;letter-spacing:.065em
    }
    .library-platform-group>h3{padding:0 11px}
    .library-section-heading{
      display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 11px 6px
    }
    .library-list{display:flex;flex-direction:column;gap:5px;min-width:0}
    .library-entry{
      display:flex;flex-direction:column;align-items:stretch;gap:8px;min-width:0;
      margin:0 4px;padding:9px 10px;border:0;border-radius:6px;
      background:var(--glass-field-soft);box-shadow:none
    }
    .library-entry-text{display:flex;flex:1 1 auto;min-width:0;flex-direction:column;gap:5px}
    .library-entry-head{display:flex;align-items:center;gap:7px;min-width:0}
    .library-entry-head strong{
      min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px
    }
    .library-badge{
      flex:none;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      border-radius:999px;padding:3px 7px;background:var(--glass-field);
      color:var(--text);font-size:9.5px;font-weight:750
    }
    .library-preview{
      margin:0;min-height:2.6em;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
      color:var(--text);font-size:11.5px;line-height:1.35
    }
    .library-meta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:10.5px}
    .library-dates{display:grid;grid-template-columns:1fr;gap:2px;color:var(--muted);font-size:10px;line-height:1.3}
    .library-entry>button{
      align-self:flex-start;flex:none;min-height:28px;border:0;border-radius:6px;padding:0 9px;
      background:var(--glass-strong);color:inherit;font-size:11px;font-weight:700;box-shadow:var(--glass-edge)
    }
    .library-entry>button:hover,.library-entry>button:focus-visible{background:var(--glass-field)}
    .library-entry>button:disabled{opacity:.45}
    .library-empty{
      margin:0 4px;padding:9px 10px;border-radius:6px;background:var(--glass-field-soft);
      border:0;color:var(--muted);font-size:11px
    }
    .dialog{display:flex;flex-direction:column;gap:7px;width:100%;min-height:0;max-height:100%;overflow-y:auto;overscroll-behavior:contain;padding:3px}
    .dialog-label{font-size:12px;line-height:1.35;color:var(--muted);padding:2px 4px}
    #dialogInput{
      width:100%;min-height:34px;max-height:112px;resize:none;border:0;border-radius:7px;
      background:var(--glass-field);color:inherit;padding:8px 9px;outline:0;font:inherit;font-size:13px
    }
    #dialogInput[hidden]{display:none}
    .dialog-actions{display:flex;justify-content:flex-end;gap:5px}
    .dialog-actions button{min-height:30px;border:0;border-radius:6px;padding:0 10px;background:var(--glass-field-soft);color:inherit;font-size:12px}
    .dialog-actions #dialogOk{background:var(--glass-strong);font-weight:650;box-shadow:var(--glass-edge)}
    #findMenu .menu-list{gap:0;width:100%}
    #findMenu .tools:last-child{flex-wrap:wrap}
    #findMenu .tools button{flex:1 1 auto;white-space:nowrap}
    @media (prefers-reduced-motion:reduce){.glass-menu{animation:none}}
    @media (orientation:landscape),(min-width:760px){
      html[data-device-gate] .device-gate{display:block}
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="device-gate" id="deviceGate" role="status" aria-live="polite" aria-labelledby="deviceGateTitle" aria-describedby="deviceGateText">
    <div class="device-gate-card">
      <strong id="deviceGateTitle">Melhor em modo retrato</strong>
      <p id="deviceGateText">Para uma melhor experiência, use um smartphone no modo retrato. Você pode continuar nesta tela.</p>
    </div>
  </div>
  <div class="fade-top" aria-hidden="true"></div>
  <div class="fade-bot" aria-hidden="true"></div>
  <div class="app">
    <div id="ux-root"></div>
    <div class="canvas" id="canvas">
      <div class="scroll" id="scroll">
        <div class="telegraph-title" id="telegraphTitleSlot" hidden></div>
        <article id="editor" class="editor" contenteditable="true" spellcheck="true" inputmode="text" enterkeyhint="enter" aria-label="Editor" data-placeholder="Escreva aqui…"></article>
      </div>
    </div>
  </div>
  <script src="marked.js"></script>
  <script src="turndown.js"></script>
  <script src="editor-core.js?v=ce99a97891de"></script>
  <script type="module" src="ui.js?v=84630ae34fce"></script>
  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      const root=document.documentElement;
      const telegramMiniApp=Boolean(window.Telegram?.WebApp?.initData);
      const initialDeviceNotice=!telegramMiniApp&&(matchMedia('(orientation:landscape)').matches||matchMedia('(min-width:760px)').matches);
      if(initialDeviceNotice){
        root.setAttribute('data-device-gate','');
        setTimeout(()=>root.removeAttribute('data-device-gate'),4300);
      }
      const destBtn=document.querySelector('#destBtn');
      const tools=document.querySelector('.document-tools');
      const slot=document.querySelector('#telegraphTitleSlot');
      const input=tools?.querySelector('#docName');
      if(!destBtn||!tools||!slot||!input)return;
      const exportHost=document.querySelector('#exportMenu .glass-menu-content')||document.querySelector('#exportMenu');
      if(!exportHost)return;
      const exportAnchor=exportHost.firstChild;
      const sync=()=>{
        const telegraph=destBtn.getAttribute('aria-pressed')==='true';
        if(telegraph){
          if(tools.parentElement!==slot)slot.append(tools);
          slot.hidden=false;
          tools.setAttribute('data-field-label','Título da página no Telegraph');
          input.setAttribute('aria-label','Título da página no Telegraph');
          input.setAttribute('placeholder','Título da página no Telegraph');
          input.setAttribute('enterkeyhint','next');
        }else{
          if(tools.parentElement!==exportHost)exportHost.insertBefore(tools,exportAnchor);
          slot.hidden=true;
          tools.setAttribute('data-field-label','Título do documento');
          input.setAttribute('aria-label','Título do documento');
          input.setAttribute('placeholder','Título do documento');
          input.removeAttribute('enterkeyhint');
        }
      };
      new MutationObserver(sync).observe(destBtn,{attributes:true,attributeFilter:['aria-pressed']});
      sync();
    });
  </script>
</body>
</html>
