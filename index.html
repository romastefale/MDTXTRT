    .glass-menu.dialog-menu,.glass-menu.find-menu{width:min(280px,var(--menu-max-width,calc(100vw - 16px)))}
    .glass-menu:not(:popover-open){display:none}
    .glass-menu:popover-open{display:block;animation:glass-menu-in .14s cubic-bezier(.2,.75,.25,1)}
    #dialogMenu:popover-open::backdrop{background:transparent;pointer-events:auto}
    @keyframes glass-menu-in{from{opacity:0}to{opacity:1}}
    .glass-menu-material{border-radius:var(--menu-radius)}
    .glass-menu-content{
      position:relative;z-index:1;display:flex;flex-direction:column;max-height:var(--menu-max-height,min(55vh,420px));overflow:hidden;
      border-radius:var(--menu-radius);padding:5px 6px;
      box-shadow:0 14px 34px var(--menu-shadow),0 2px 6px var(--menu-shadow-tight)
    }
    .menu-list{
      display:flex;flex:1 1 auto;flex-direction:column;gap:0;min-height:0;max-height:none;
      overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y
    }
    .menu-list > button{
      display:flex;align-items:center;justify-content:flex-start;text-align:left;
      width:100%;min-width:0;white-space:nowrap;height:var(--menu-row-h);min-height:var(--menu-row-h);
      border-radius:6px;border:0;background:transparent;box-shadow:none;
      padding:0 11px;font-size:13px;line-height:1;gap:8px;color:inherit
    }
    .menu-list > button[hidden]{display:none}
    .menu-list > button:hover,.menu-list > button:focus-visible{background:var(--accent);color:#fff}
    .menu-list > button:active{background:color-mix(in srgb,var(--accent) 86%,#000)}
    .menu-divider{height:11px;min-height:11px;position:relative}
    .menu-divider::after{content:"";position:absolute;left:8px;right:8px;top:5px;height:1px;background:var(--menu-edge)}
    .sheet-ico{width:16px;height:16px;border-radius:4px;flex:none;display:grid;place-items:center;background:transparent;box-shadow:none}
    .sheet-ico .ui-icon,.sheet-ico svg{width:13px;height:13px}
    .menu-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
    .menu-chevron{width:13px;height:13px;flex:none;display:grid;place-items:center;margin-left:auto;opacity:.55}
    .menu-chevron .ui-icon{width:12px;height:12px}
    .menu-list > button:hover .menu-chevron,.menu-list > button:focus-visible .menu-chevron{opacity:1}
    .plus-submenu .submenu-back{font-weight:650}
    .glass-menu .heading-list .h-opt{font-size:13px;font-weight:500;letter-spacing:0;text-transform:none}
    .toast{
      position:fixed;left:50%;bottom:calc(var(--vv-bottom) + var(--foot-inset) + 8px);
      transform:translateX(-50%);z-index:50;display:none;min-width:80px;max-width:min(86vw,420px);
      padding:0;border-radius:999px;font-size:12px;line-height:1.25;color:var(--text);pointer-events:none
    }
    .toast.on{display:block}
    .toast-material{
      border-radius:999px;background:var(--glass-tint);overflow:hidden
    }
    .toast-content{
      position:relative;z-index:1;display:block;padding:8px 13px;
      color:inherit;text-align:center;white-space:normal
    }
    .tools{display:flex;gap:6px;align-items:center;padding:4px;max-width:100%}
    .document-tools{padding:5px 6px 3px;flex-direction:column;align-items:stretch;gap:3px}
    .document-tools::before{content:attr(data-field-label);display:block;padding:0 3px;color:var(--muted);font-size:11px;line-height:1.25}
    .hint{max-width:240px;white-space:normal;margin:5px 8px 7px;font-size:12px;line-height:1.35}
    .tools input{
      min-width:0;width:100%;height:32px;border:0;border-radius:7px;
      background:var(--glass-field);color:inherit;padding:0 9px;outline:0;font-size:13px
    }
    .tools button{
      min-height:30px;border:0;border-radius:6px;background:color-mix(in srgb,var(--accent) 18%,transparent);
      padding:0 9px;color:inherit;font-size:12px
    }
    .library-screen{
      position:fixed;z-index:60;left:max(10%,calc(var(--safe-left) + 10px));right:max(10%,calc(var(--safe-right) + 10px));
      top:calc(var(--vv-top) + var(--safe-top) + 10%);bottom:calc(var(--vv-bottom) + var(--foot-inset) + 10%);
      width:auto;max-width:784px;height:auto;margin:0 auto;padding:0;border:0;background:transparent;color:var(--text)
    }
    .library-screen:not(:popover-open){display:none}
    .library-screen:popover-open{display:block}
    .library-screen:popover-open::backdrop{background:color-mix(in srgb,var(--bg) 34%,transparent);backdrop-filter:blur(2px)}
    .library-material{height:100%;border-radius:18px;background:var(--glass-tint);overflow:hidden}
    .library-shell{display:flex;flex-direction:column;gap:14px;height:100%;min-height:0;padding:12px;overflow-y:auto;overscroll-behavior:contain}
    .library-head{
      display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:10px;
      position:sticky;top:-12px;z-index:2;padding:12px 0 8px;
      background:linear-gradient(180deg,var(--glass-tint) 78%,transparent)
    }
    .library-heading{min-width:0;padding-top:2px}
    .library-head h2{margin:0;font-size:18px;line-height:1.2}
    .library-head .hint{max-width:620px;margin:4px 0 0}
    .library-back-pill,.library-manage-pill{flex:none}
    .library-manage-pill{justify-self:end}
    .library-status{max-width:none;margin:0 2px}
    .library-section{display:flex;flex-direction:column;gap:8px;min-width:0}
    .library-section h3{margin:0 2px;font-size:13px;line-height:1.3;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .library-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px;min-width:0}
    .library-entry{
      display:flex;flex-direction:column;align-items:stretch;gap:12px;min-width:0;min-height:176px;
      padding:12px;border-radius:14px;background:var(--library-card-bg);border:1px solid var(--line)
    }
    .library-entry-text{display:flex;flex:1 1 auto;min-width:0;flex-direction:column;gap:7px}
    .library-entry-head{display:flex;align-items:center;gap:7px;min-width:0}
    .library-entry-head strong{min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
    .library-badge{
      flex:none;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      border-radius:999px;padding:3px 7px;background:color-mix(in srgb,var(--accent) 13%,transparent);
      color:var(--accent);font-size:10px;font-weight:700
    }
    .library-preview{
      margin:0;min-height:3.9em;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
      color:var(--text);font-size:12px;line-height:1.3
    }
    .library-meta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px}
    .library-dates{display:grid;grid-template-columns:1fr;gap:2px;color:var(--muted);font-size:10.5px;line-height:1.3}
    .library-entry>button{
      align-self:flex-start;flex:none;min-height:31px;border:0;border-radius:9px;padding:0 11px;
      background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-size:12px;font-weight:650
    }
    .library-entry>button:disabled{opacity:.45}
    .library-empty{grid-column:1/-1;padding:12px;border-radius:12px;background:var(--glass-field-soft);color:var(--muted);font-size:12px}
    @media (max-width:520px){
      .library-head{grid-template-columns:auto minmax(0,1fr) auto;gap:7px}
      .library-head h2{font-size:16px}
      .library-head .hint{font-size:11px}
      .library-list{grid-template-columns:1fr}
      .library-entry{min-height:0}
    }
    .dialog{display:flex;flex-direction:column;gap:7px;width:100%;min-height:0;max-height:100%;overflow-y:auto;overscroll-behavior:contain;padding:3px}
    .dialog-label{font-size:12px;line-height:1.35;color:var(--muted);padding:2px 4px}
    #dialogInput{
      width:100%;min-height:34px;max-height:112px;resize:none;border:0;border-radius:7px;
      background:var(--glass-field);color:inherit;padding:8px 9px;outline:0;font:inherit;font-size:13px
    }
    #dialogInput[hidden]{display:none}
    .dialog-actions{display:flex;justify-content:flex-end;gap:5px}
    .dialog-actions button{min-height:30px;border:0;border-radius:6px;padding:0 10px;background:var(--glass-field-soft);color:inherit;font-size:12px}
    .dialog-actions #dialogOk{background:var(--accent);color:#fff}
    #findMenu .menu-list{gap:0;width:100%}
    #findMenu .tools:last-child{flex-wrap:wrap}
    #findMenu .tools button{flex:1 1 auto;white-space:nowrap}
    @media (prefers-reduced-motion:reduce){.glass-menu{animation:none}}
    @media (orientation:landscape),(min-width:760px){
      html[data-device-gate] .device-gate{display:block}
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="device-gate" id="deviceGate" role="status" aria-live="polite" aria-labelledby="deviceGateTitle" aria-describedby="deviceGateText">
    <div class="device-gate-card">
      <strong id="deviceGateTitle">Melhor em modo retrato</strong>
      <p id="deviceGateText">Para uma melhor experiência, use um smartphone no modo retrato. Você pode continuar nesta tela.</p>
    </div>
  </div>
  <div class="fade-top" aria-hidden="true"></div>
  <div class="fade-bot" aria-hidden="true"></div>
  <div class="app">
    <div id="ux-root"></div>
    <div class="canvas" id="canvas">
      <div class="scroll" id="scroll">
        <div class="telegraph-title" id="telegraphTitleSlot" hidden></div>
        <article id="editor" class="editor" contenteditable="true" spellcheck="true" inputmode="text" enterkeyhint="enter" aria-label="Editor" data-placeholder="Escreva aqui…"></article>
      </div>
    </div>
  </div>
  <script src="marked.js"></script>
  <script src="turndown.js"></script>
  <script src="editor-core.js?v=29846a6f4a7d"></script>
  <script type="module" src="ui.js?v=5fc9ab42ed26"></script>
  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      const root=document.documentElement;
      const telegramMiniApp=Boolean(window.Telegram?.WebApp?.initData);
      const initialDeviceNotice=!telegramMiniApp&&(matchMedia('(orientation:landscape)').matches||matchMedia('(min-width:760px)').matches);
      if(initialDeviceNotice){
        root.setAttribute('data-device-gate','');
        setTimeout(()=>root.removeAttribute('data-device-gate'),4300);
      }
      const destBtn=document.querySelector('#destBtn');
      const tools=document.querySelector('.document-tools');
      const slot=document.querySelector('#telegraphTitleSlot');
      const input=tools?.querySelector('#docName');
      if(!destBtn||!tools||!slot||!input)return;
      const exportHost=document.querySelector('#exportMenu .glass-menu-content')||document.querySelector('#exportMenu');
      if(!exportHost)return;
      const exportAnchor=exportHost.firstChild;
      const sync=()=>{
        const telegraph=destBtn.getAttribute('aria-pressed')==='true';
        if(telegraph){
          if(tools.parentElement!==slot)slot.append(tools);
          slot.hidden=false;
          tools.setAttribute('data-field-label','Título da página no Telegraph');
          input.setAttribute('aria-label','Título da página no Telegraph');
          input.setAttribute('placeholder','Título da página no Telegraph');
          input.setAttribute('enterkeyhint','next');
        }else{
          if(tools.parentElement!==exportHost)exportHost.insertBefore(tools,exportAnchor);
          slot.hidden=true;
          tools.setAttribute('data-field-label','Título do documento');
          input.setAttribute('aria-label','Título do documento');
          input.setAttribute('placeholder','Título do documento');
          input.removeAttribute('enterkeyhint');
        }
      };
      new MutationObserver(sync).observe(destBtn,{attributes:true,attributeFilter:['aria-pressed']});
      sync();
    });
  </script>
</body>
</html>
