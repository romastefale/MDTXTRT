  <style>
    :root{

      --glass-control-edge:rgba(255,255,255,.08);
      --glass-shadow:0 1px 2px rgba(0,0,0,.16),0 6px 18px rgba(0,0,0,.14),0 18px 40px rgba(0,0,0,.1);
      --glass-shadow-lg:0 2px 6px rgba(0,0,0,.14),0 12px 28px rgba(0,0,0,.16),0 28px 56px rgba(0,0,0,.12);

    }
    html.tg-shell{
      --safe-top:max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px),var(--tg-content-safe-area-inset-top,0px));
      --safe-bottom:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px),var(--tg-content-safe-area-inset-bottom,0px));
      --safe-left:max(env(safe-area-inset-left,0px),var(--tg-safe-area-inset-left,0px),var(--tg-content-safe-area-inset-left,0px));

    html.light{

      --glass-frost:0.08;
      --glass-blur:6px;
      --glass:rgba(255,255,255,var(--glass-frost));
      --glass-edge:transparent;

    }

    }

    html.light{background-image:radial-gradient( 92% 30% at -10% 0%, rgba(246, 236, 255, 0.72) 0%, rgba(248, 243, 255, 0.42) 44%, rgba(250, 251, 255, 0) 78% ), radial-gradient( 84% 30% at 112% 19%, rgba(255, 237, 245, 0.78) 0%, rgba(255, 247, 250, 0.42) 47%, rgba(250, 252, 255, 0) 80% ), radial-gradient( 100% 38% at -18% 40%, rgba(230, 255, 248, 0.88) 0%, rgba(239, 255, 251, 0.56) 39%, rgba(248, 253, 255, 0.18) 63%, rgba(250, 252, 255, 0) 84% ), radial-gradient( 96% 40% at 56% 49%, rgba(231, 246, 255, 0.88) 0%, rgba(240, 249, 255, 0.58) 46%, rgba(248, 252, 255, 0.18) 69%, rgba(250, 252, 255, 0) 86% ), radial-gradient( 82% 31% at 112% 72%, rgba(247, 244, 255, 0.52) 0%, rgba(250, 248, 255, 0.30) 49%, rgba(250, 252, 255, 0) 82% ), radial-gradient( 76% 28% at 108% 100%, rgba(255, 247, 242, 0.70) 0%, rgba(255, 251, 248, 0.38) 48%, rgba(250, 252, 255, 0) 81% ), radial-gradient( 42% 16% at 57% 98%, rgba(229, 252, 255, 0.46) 0%, rgba(242, 253, 255, 0.20) 54%, rgba(250, 252, 255, 0) 82% ), linear-gradient( 180deg, #faf8fe 0%, #f7fbff 28%, #f4fbff 52%, #f8fbff 78%, #fbfaff 100% )}
    ::selection{background:color-mix(in srgb,var(--accent) 38%, transparent);color:inherit}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}

    .seg button .ui-icon,.action-dot .ui-icon,.sheet-ico .ui-icon{width:16px;height:16px}
    .editor h1,.editor h2,.editor h3,.editor h4,.editor h5,.editor h6{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.03em;line-height:1.2;font-weight:650}

    .editor .tg-footer,.editor footer{display:block;font-size:12px;color:var(--muted);margin:1.6em 0 .4em;padding-top:.7em;border-top:1px solid color-mix(in srgb,var(--text) 14%, transparent);font-weight:400}

    .heading-list .h-opt.h4{font-size:14px;font-weight:650}
    .heading-list .h-opt.h5{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase}
    .heading-list .h-opt.h6{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .heading-list .h-opt.footer{font-size:12px;color:var(--muted)}
    .heading-list button.is-current{color:var(--accent)}
     .frost{
      position:relative;
      background:var(--glass);
      border:0;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
      backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturation));
      -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturation));
    }
    .frost::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:transparent;box-shadow:inset 0 1px 0 var(--glass-highlight),inset 0 0 0 1px var(--glass-edge)}
    html.dark .frost{box-shadow:var(--glass-shadow)}
    .app{
      position:relative;z-index:1;
      width:100%;height:100%;min-height:0;max-width:none;margin:0;padding:0;
      overflow:hidden;background:transparent;
    }
    .chrome-top{position:absolute;inset:0 0 auto 0;z-index:20;padding:var(--safe-top) var(--safe-right) var(--gap) var(--safe-left);pointer-events:none}
    .chrome-top .topbar,.chrome-top .meta{pointer-events:auto}
    .topbar{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;height:var(--topbar-h);margin:var(--gap) 12px 0;padding:0 12px}
    .brand{font-weight:700;font-size:15px;letter-spacing:.08em;text-align:center;border:0;background:var(--glass);color:inherit;padding:8px 12px;margin:0;border-radius:999px;font-family:inherit;appearance:none;-webkit-appearance:none}
    .meta{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:var(--gap);height:var(--meta-h);margin:var(--gap) 16px 0}
    .meta .seg:last-child{margin-left:auto}
    .seg{display:flex;align-items:center;gap:4px;padding:4px;height:44px;border-radius:999px}
    .seg button{
      width:36px;height:36px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center
    }
    .seg button.active{background:color-mix(in srgb,var(--text) 12%, transparent)}
    .seg #destBtn{background:color-mix(in srgb,var(--text) 7%,transparent)}
    .seg #destBtn.active{background:color-mix(in srgb,var(--text) 14%,transparent)}
    html.dark .seg button.active{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
    html.dark .seg #destBtn{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
    html.dark .seg #destBtn.active{background:color-mix(in srgb,var(--accent) 24%,transparent)}
    .seg button.is-flash{position:relative}
    .seg button.is-flash::before{content:"";position:absolute;inset:0;width:36px;height:36px;margin:auto;border-radius:50%;background:color-mix(in srgb,var(--text) 14%, transparent);z-index:0;animation:flash-out 1.4s ease forwards}
    html.light .seg button.is-flash::before{background:color-mix(in srgb,var(--text) 12%, #fff)}
    .seg button.is-flash > *{position:relative;z-index:1}
    @keyframes flash-out{0%,35%{opacity:1}100%{opacity:0}}
    .bar > button{position:relative}
    .bar > button.on{background:transparent;color:inherit}
    .bar > button.on::before{content:"";position:absolute;inset:0;width:36px;height:36px;margin:auto;border-radius:50%;background:color-mix(in srgb,var(--text) 14%, transparent);z-index:0}
    html.light .bar > button.on::before{background:color-mix(in srgb,var(--text) 12%, #fff)}
    html.dark .bar > button.on{color:var(--accent)}
    html.dark .bar > button.on::before{background:color-mix(in srgb,var(--accent) 22%,transparent)}
    .bar > button > *{position:relative;z-index:1}
    .canvas{position:absolute;inset:0;min-height:0;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:var(--head-inset) max(16px,var(--safe-right)) var(--foot-inset) max(16px,var(--safe-left));scroll-padding-block:var(--head-inset) var(--foot-inset)}
    .editor:empty::before{content:attr(data-placeholder);color:var(--muted);pointer-events:none}
    .editor{
      outline:none;flex:1 0 auto;min-height:0;caret-color:var(--accent);
      -webkit-user-select:text;user-select:text
    }
    .editor p{margin:.7em 0}
    .editor blockquote{margin:1em 0;padding:0 0 0 12px;border-left:3px solid var(--accent)}

    .editor th,.editor td{border:1px solid var(--line);padding:6px}
    .editor a{color:var(--accent)}
    .editor img,.editor video,.editor iframe{max-width:100%;height:auto}
    .editor figure{margin:1em 0;padding:8px;border:1px solid color-mix(in srgb,var(--text) 12%,transparent);border-radius:18px;background:color-mix(in srgb,var(--text) 5%,transparent);overflow:hidden}
    .editor figure>img,.editor figure>video,.editor figure>iframe{display:block;width:100%;border-radius:12px;background:color-mix(in srgb,var(--text) 7%,transparent)}
    .editor figure>audio{display:block;width:100%;min-height:40px}
    .editor figcaption{font-size:13px;line-height:1.35;color:var(--muted);padding:8px 4px 2px}
    .editor tg-math{display:inline-block;max-width:100%;margin:0 .08em;padding:.12em .38em;border-radius:7px;background:color-mix(in srgb,var(--accent) 12%,transparent);font:500 .94em/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
    .editor tg-math-block{display:block;margin:1em 0;padding:12px 14px;border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:14px;background:color-mix(in srgb,var(--accent) 8%,transparent);font:500 14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:auto}
    .editor tg-button-row{display:flex;justify-content:center;gap:8px;margin:1em 0}
    .editor tg-button{display:inline-block;border-radius:12px;padding:8px 14px;background:var(--accent);color:#fff}
    .editor tg-document,.editor tg-map{display:block;margin:1em 0;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--text) 8%,transparent)}
    .editor tg-document{min-height:48px;border:1px solid color-mix(in srgb,var(--text) 12%,transparent)}
    .editor tg-document::before{content:"Documento";font-weight:600}
    .editor tg-map::before{content:"Mapa"}
    .editor [data-media-missing]{display:block;min-height:96px;border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);border-radius:12px;background:color-mix(in srgb,var(--accent) 7%,transparent)}
    .editor [data-media-missing]::after{content:"Anexo salvo indisponível";display:grid;place-items:center;min-height:96px;color:var(--muted);font-size:13px}
    .editor tg-collage,.editor tg-slideshow{display:flex;flex-wrap:wrap;gap:8px;margin:1em 0}
    .editor tg-spoiler{background:color-mix(in srgb,var(--text) 18%,transparent);border-radius:4px}
    .bar-wrap{
      position:absolute;left:0;right:0;bottom:0;z-index:20;
      padding:var(--gap) max(12px,var(--safe-right)) calc(var(--safe-bottom) + var(--gap)) max(12px,var(--safe-left));
      background:transparent;pointer-events:none;
    }
    .bar{
      position:relative;z-index:1;max-width:none;margin:0;
      display:flex;align-items:center;
      height:var(--bar-h);padding:4px;border-radius:999px;pointer-events:auto;
    }
    .bar > button{
      flex:1;min-width:0;height:40px;border:0;background:transparent;color:inherit;
      display:grid;place-items:center;border-radius:999px;padding:0
    }
    .bar .plus,.bar .send{flex:0 0 40px}
    .action-dot{
      width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
      background:var(--accent);color:#fff;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 4px 14px color-mix(in oklab,var(--accent) 45%,transparent)
    }
    html.dark .action-dot{box-shadow:0 4px 14px rgba(167,139,250,.32)}
    .action-dot svg{width:16px;height:16px}
    .seg .export{width:36px;height:36px;border:0;background:transparent;display:grid;place-items:center;padding:0;border-radius:50%}
    .seg .action-dot{width:36px;height:36px}
    .backdrop{position:absolute;inset:0;z-index:30;display:none;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
    .backdrop.on{display:block}
    .sheet{
      position:absolute;left:12px;right:12px;bottom:calc(var(--foot-inset) + 4px);
      z-index:40;width:auto;max-width:420px;margin-inline:auto;
      max-height:max(0px,calc(100% - var(--safe-top) - var(--foot-inset) - 16px));
      overflow:hidden;
      display:none;padding:8px;border:0;border-radius:30px;
      color:var(--text);background:var(--glass);
      box-shadow:0 4px 14px rgba(0,0,0,.14),0 22px 48px rgba(0,0,0,.2);
      transform-origin:50% 100%;animation:sheet-in .16s cubic-bezier(.2,.75,.25,1)
    }
    .sheet.is-top{
      bottom:auto;top:var(--head-inset);
      max-height:max(0px,calc(100% - var(--head-inset) - var(--safe-bottom) - 12px));
      transform-origin:50% 0;
    }
    html.dark .sheet{box-shadow:var(--glass-shadow-lg)}
    @keyframes sheet-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
    .menu-list{display:flex;flex-direction:column;gap:2px;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
    .menu-list > button{display:flex;align-items:center;justify-content:flex-start;text-align:left;width:auto;min-width:100%;white-space:nowrap;min-height:50px;border-radius:20px;border:0;background:transparent;box-shadow:none;padding:4px 18px 4px 6px;font-size:17px;gap:12px}
    .menu-list > button[hidden]{display:none}
    .menu-list > button:hover{background:color-mix(in srgb,var(--text) 7%,transparent)}
    .menu-list > button:active{background:color-mix(in srgb,var(--text) 12%,transparent)}
    .sheet-ico{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--glass-control);box-shadow:inset 0 1px 0 var(--glass-control-edge)}
    html.dark .sheet-ico{box-shadow:none;background:rgba(255,255,255,.055)}
    .sheet-ico .ui-icon,.sheet-ico svg{width:20px;height:20px}
    .sheet.on{display:flex;flex-direction:column}
    .toast{
      position:absolute;left:50%;bottom:calc(var(--foot-inset) + 8px);
      transform:translateX(-50%);z-index:50;display:none;
      padding:8px 12px;border-radius:999px;font-size:12px
    }
    .toast.on{display:block}
    .tools{display:flex;gap:8px;align-items:center;padding:10px;max-width:100%}
    .hint{max-width:280px;white-space:normal;margin:8px 12px 12px;font-size:14px}
    .tools input{min-width:0;width:100%;border:0;border-radius:12px;background:color-mix(in srgb,var(--text) 10%,transparent);padding:10px;outline:0}
    .tools button{border:0;border-radius:12px;background:color-mix(in srgb,var(--accent) 22%,transparent);padding:10px;color:var(--text)}
    #findMenu,#dialogMenu{max-width:350px}
    .dialog{display:flex;flex-direction:column;gap:10px;width:100%;padding:8px}
    .dialog-label{font-size:14px;line-height:1.35;color:var(--muted);padding:2px 4px}
    #dialogInput{width:100%;min-height:42px;max-height:132px;resize:none;border:0;border-radius:16px;background:color-mix(in srgb,var(--text) 10%,transparent);color:var(--text);padding:11px 12px;outline:0;font:inherit}
    #dialogInput[hidden]{display:none}
    .dialog-actions{display:flex;justify-content:flex-end;gap:8px}

    .dialog-actions #dialogOk{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
    #findMenu{width:min(350px,calc(100% - 28px))}
    #findMenu .menu-list{gap:0;width:100%}
    #findMenu .tools:last-child{flex-wrap:wrap}
    #findMenu .tools button{flex:1 1 auto;white-space:nowrap}
    @media (prefers-reduced-motion:reduce){.sheet{animation:none}}
    @media (min-width:760px){
      .meta{width:min(calc(100% - 32px),960px);margin:8px auto 0}
      .canvas{width:100%;max-width:960px;margin-inline:auto;padding-inline:32px}
      .bar-wrap{padding-inline:24px}
      .bar{max-width:760px;margin-inline:auto}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="chrome-top">
      <header class="topbar">
        <button type="button" class="brand frost material-target" id="brandBtn">MDTXTRT</button>
      </header>
      <div class="meta">
      <div class="seg frost material-target">
        <button type="button" id="undoBtn" aria-label="Desfazer"><span class="ui-icon" data-icon="undo"></span></button>
        <button type="button" id="redoBtn" aria-label="Refazer"><span class="ui-icon" data-icon="redo"></span></button>
      </div>
      <div class="seg frost material-target">
        <button type="button" id="destBtn" aria-label="Destino: Telegram" title="Destino: Telegram"><span class="ui-icon" data-icon="telegram"></span></button>
        <button type="button" class="export" id="exportBtn" aria-label="Exportar" title="Exportar"><span class="action-dot"><span class="ui-icon" data-icon="export"></span></span></button>
      </div>
    </div>
    </div>
    <div class="canvas" id="canvas">
      <article id="editor" class="editor" contenteditable="true" spellcheck="true" inputmode="text" enterkeyhint="enter" aria-label="Editor" data-placeholder="Escreva aqui…"></article>
    </div>
  <div class="bar-wrap">
    <div class="bar frost material-target frost-only" id="typebar">
      <button class="plus" id="plusBtn" aria-label="Mais"><span class="ui-icon" data-icon="plus"></span></button>
      <button type="button" data-cmd="bold" aria-label="Negrito"><span class="ui-icon" data-icon="bold"></span></button>
      <button type="button" data-cmd="italic" aria-label="Itálico"><span class="ui-icon" data-icon="italic"></span></button>
      <button type="button" data-cmd="underline" aria-label="Sublinhado"><span class="ui-icon" data-icon="underline"></span></button>
      <button type="button" id="quoteBtn" aria-label="Citação"><span class="ui-icon" data-icon="quote"></span></button>
      <button type="button" id="linkBtn" aria-label="Link"><span class="ui-icon" data-icon="link"></span></button>
      <button type="button" id="headingBtn" aria-label="Título"><span class="ui-icon" data-icon="heading"></span></button>
      <button type="button" id="listBtn" aria-label="Lista"><span class="ui-icon" data-icon="list"></span></button>
    </div>
  </div>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet frost material-target" id="headingMenu">
    <div class="menu-list heading-list">
      <button class="h-opt h1" data-block="h1"><span class="sheet-ico"><span class="ui-icon" data-icon="h1"></span></span>Título H1</button>
      <button class="h-opt h2" data-block="h2"><span class="sheet-ico"><span class="ui-icon" data-icon="h2"></span></span>Título H2</button>
      <button class="h-opt h3" data-block="h3"><span class="sheet-ico"><span class="ui-icon" data-icon="h3"></span></span>Título H3</button>
      <button class="h-opt h4" data-block="h4"><span class="sheet-ico"><span class="ui-icon" data-icon="h4"></span></span>Título H4</button>
      <button class="h-opt h5" data-block="h5"><span class="sheet-ico"><span class="ui-icon" data-icon="h5"></span></span>Título H5</button>
      <button class="h-opt h6" data-block="h6"><span class="sheet-ico"><span class="ui-icon" data-icon="h6"></span></span>Título H6</button>
      <button data-block="p"><span class="sheet-ico"><span class="ui-icon" data-icon="paragraph"></span></span>Corpo</button>
      <button class="h-opt footer" data-block="footer"><span class="sheet-ico"><span class="ui-icon" data-icon="footer"></span></span>Rodapé</button>
    </div>
  </div>
  <div class="sheet frost material-target" id="listMenu">
    <div class="menu-list">
      <button data-cmd="insertUnorderedList"><span class="sheet-ico"><span class="ui-icon" data-icon="list"></span></span>Lista com marcadores</button>
      <button data-insert="ordered"><span class="sheet-ico"><span class="ui-icon" data-icon="format_list_numbered"></span></span>Lista ordenada</button>
      <button data-insert="task" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="task"></span></span>Checklist</button>
    </div>
  </div>
  <div class="sheet frost material-target" id="quoteMenu">
    <div class="menu-list">
      <button data-block="blockquote"><span class="sheet-ico"><span class="ui-icon" data-icon="quote"></span></span>Citação</button>
      <button data-insert="pullquote" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="quote"></span></span>Citação em destaque</button>
      <button data-insert="expandquote"><span class="sheet-ico"><span class="ui-icon" data-icon="more"></span></span>Citação expansível</button>
    </div>
  </div>
  <div class="sheet frost material-target" id="importMenu">
    <div class="tools"><input id="docName" value="Ideia" aria-label="Nome do documento" maxlength="256"></div>
    <div class="menu-list">
      <button id="importMdBtn"><span class="sheet-ico"><span class="ui-icon" data-icon="markdown"></span></span>Importar Markdown</button>
      <button id="importTxtBtn"><span class="sheet-ico"><span class="ui-icon" data-icon="text_fields"></span></span>Importar TXT</button>
      <button id="findBtn"><span class="sheet-ico"><span class="ui-icon" data-icon="search"></span></span>Localizar e substituir</button>
    </div>
  </div>
  <div class="sheet frost material-target" id="exportMenu">
    <p class="hint">Para publicar no Telegram ou Telegraph, abra o Mini App. Para levar este documento, exporte Markdown e importe lá.</p>
    <div class="menu-list">
      <button id="openAppBtn"><span class="sheet-ico"><span class="ui-icon" data-icon="telegram"></span></span>Abrir Mini App para publicar</button>
      <button id="exportMdBtn"><span class="sheet-ico"><span class="ui-icon" data-icon="markdown"></span></span>Exportar Markdown</button>
      <button id="exportTxtBtn"><span class="sheet-ico"><span class="ui-icon" data-icon="text_fields"></span></span>Exportar TXT</button>
    </div>
  </div>
  <div class="sheet frost material-target" id="plusMenu">
    <div class="menu-list">
      <button data-cmd="strike"><span class="sheet-ico"><span class="ui-icon" data-icon="strikethrough_s"></span></span>Riscado</button>
      <button data-cmd="mark" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="ink_highlighter"></span></span>Marca-texto</button>
      <button data-cmd="spoiler" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="visibility_off"></span></span>Spoiler</button>
      <button data-cmd="code"><span class="sheet-ico"><span class="ui-icon" data-icon="code"></span></span>Código</button>
      <button data-cmd="sub" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="subscript"></span></span>Subscrito</button>
      <button data-cmd="sup" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="superscript"></span></span>Sobrescrito</button>
      <button data-cmd="math" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="functions"></span></span>Fórmula inline</button>
      <button data-insert="mathblock" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="calculate"></span></span>Fórmula em bloco</button>
      <button data-insert="divider"><span class="sheet-ico"><span class="ui-icon" data-icon="horizontal_rule"></span></span>Divisor</button>
      <button data-insert="table" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="table"></span></span>Tabela</button>
      <button data-insert="details" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="details"></span></span>Conteúdo expansível</button>
      <button data-insert="image"><span class="sheet-ico"><span class="ui-icon" data-icon="image"></span></span>Imagem</button>
      <button id="mediaBtn" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="attach_file"></span></span>Anexar mídia</button>
      <button data-insert="video"><span class="sheet-ico"><span class="ui-icon" data-icon="movie"></span></span>Vídeo</button>
      <button data-insert="embed" data-telegraph="only"><span class="sheet-ico"><span class="ui-icon" data-icon="web"></span></span>Incorporar</button>
      <button data-insert="audio" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="music_note"></span></span>Áudio</button>
      <button data-insert="document" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="file"></span></span>Documento</button>
      <button data-insert="map" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="location_on"></span></span>Mapa</button>
      <button data-insert="collage" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="view_comfy"></span></span>Colagem</button>
      <button data-insert="slideshow" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="slideshow"></span></span>Slideshow</button>
      <button data-insert="anchor" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="anchor"></span></span>Âncora</button>
      <button data-insert="reference" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="sticky_note_2"></span></span>Referência</button>
      <button data-insert="time" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="schedule"></span></span>Data e hora</button>
      <button data-insert="emoji" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="mood"></span></span>Emoji personalizado</button>
      <button data-insert="button" data-tg="no"><span class="sheet-ico"><span class="ui-icon" data-icon="buttons"></span></span>Botão</button>
    </div>
  </div>
  <input id="fileInput" type="file" accept=".txt,.md,text/plain,text/markdown" hidden>
  <input id="mediaInput" type="file" accept="image/*,video/*,audio/*,.pdf,.zip" hidden>
  <div class="toast frost material-target" id="toast"></div>
  <div class="sheet frost material-target" id="dialogMenu">
    <div class="dialog">
      <div class="dialog-label" id="dialogLabel"></div>
      <textarea id="dialogInput" rows="1" spellcheck="false"></textarea>
      <div class="dialog-actions"><button type="button" id="dialogCancel">Cancelar</button><button type="button" id="dialogOk">OK</button></div>
    </div>
  </div>
  <div class="sheet frost material-target" id="findMenu"><div class="menu-list"><div class="tools"><input id="findText" placeholder="Localizar"></div><div class="tools"><input id="replaceText" placeholder="Substituir"></div><div class="tools"><button id="findNext">Próximo</button><button id="replaceOne">Substituir</button><button id="replaceAll">Substituir tudo</button></div></div></div>
  </div>
  <script src="marked.js"></script>
  <script src="turndown.js"></script>
  <script src="app.js"></script>
</body>
</html>
